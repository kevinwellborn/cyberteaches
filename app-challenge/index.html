  const app = document.getElementById('app');
  const UNITS = window.AP_UNITS, INFO = window.CAC_INFO;
  const ALL = UNITS.flatMap(u => u.topics.map(t => Object.assign({ unit: u }, t)));
  const LIVE = ALL.filter(t => !t.soon);
  const FIELDS = LIVE.flatMap(t => (t.fields || []).map(f => Object.assign({ topic: t }, f)));
  const KEY = 'ctcac-progress-v1', WKEY = 'ctcac-work-v1';
  const read = (k, d) => { try { return JSON.parse(localStorage.getItem(k)) || d; } catch (e) { return d; } };
  const write = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };
  let progress = read(KEY, {});
  const work = read(WKEY, {}); work.steps = work.steps || {}; work.fields = work.fields || {};
  const save = () => { write(KEY, progress); if (window.Account) Account.push(); };
  if (window.Account) Account.attach(KEY, () => progress, merged => { progress = merged; write(KEY, progress); route(); });
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
  const isDone = id => progress[id] && progress[id].passed;
  const slug = id => 'lesson-' + id.replace('.', '-');
  const uvar = u => `--u:var(--u${u.num})`;

  // Routes are plain names (#home, #rules, #plan, #lesson-0-1). #/topic/0.1 also works, for links from the lesson pages.
  function route(){
    const h = location.hash.replace(/^#\/?/, '');
    const m = h.match(/^lesson-(\d+)-(\d+)$/) || h.match(/^topic\/(\d+)\.(\d+)$/);
    const t = m && LIVE.find(x => x.id === m[1] + '.' + m[2]);
    const page = t ? '' : h === 'rules' || h === 'plan' ? h : 'home';
    document.querySelectorAll('[data-nav]').forEach(a => a.classList.toggle('on', a.dataset.nav === page));
    if (t) renderTopic(t.id); else if (page === 'rules') renderRules(); else if (page === 'plan') renderPlan(); else renderHome();
    window.scrollTo(0, 0);
  }
  window.addEventListener('hashchange', route);

  function topicLinks(u){
    return u.topics.map(t => t.soon
      ? `<span class="topic-link soon"><b>${t.id}</b><span>${esc(t.title)}</span><span class="tagsoon">Soon</span></span>`
      : `<a class="topic-link${isDone(t.id) ? ' done' : ''}" href="#${slug(t.id)}"><b>${t.id}</b><span>${esc(t.title)}</span><span class="chk" aria-label="${isDone(t.id) ? 'Completed' : 'Not completed'}">${isDone(t.id) ? '✓' : ''}</span></a>`).join('');
  }

  function renderHome(){
    const d = LIVE.filter(t => isDone(t.id)).length, next = LIVE.find(t => !isDone(t.id)) || LIVE[0];
    app.innerHTML = `
      <section class="hero">
        <div>
          <span class="label">CyberTeaches · Free course · Grades 6 to 12</span>
          <h1 style="margin-top:8px">Build your own app for the <em>Congressional App Challenge.</em></h1>
          <p>Go from no idea to a submitted entry, one small step at a time. No teacher and no coding experience needed. Work alone or with up to three friends.</p>
          <div class="row" style="margin-bottom:18px">
            <a class="btn primary" href="#${slug(next.id)}">${d ? 'Continue' : 'Start'} with ${next.id} ${esc(next.title)}</a>
            <a class="btn" href="#rules">Read the rules in plain words</a>
          </div>
          <div class="meter"><span class="label">${d} of ${LIVE.length} lessons complete</span><div class="meter-bar"><i style="width:${Math.round(d / LIVE.length * 100)}%"></i></div></div>
        </div>
        <div class="card entry">
          <span class="label">What you will submit</span>
          <ol>
            <li><span class="n">1</span><div><b>A working app</b><span>Any topic, any language, any platform. It has to really work.</span></div></li>
            <li><span class="n">2</span><div><b>A demo video, 1 to 3 minutes</b><span>Public on YouTube or Vimeo. Six things it must cover.</span></div></li>
            <li><span class="n">3</span><div><b>Written answers</b><span>Six short questions about your app and what you learned.</span></div></li>
          </ol>
          <div class="notice">${esc(INFO.note)}</div>
        </div>
      </section>
      <div class="units">
        ${UNITS.map(u => {
          const live = u.topics.filter(t => !t.soon), ud = live.filter(t => isDone(t.id)).length;
          return `<section class="card unit" style="${uvar(u)}">
            <div class="unit-num" style="background:var(--u)">${u.num}</div>
            <div>
              <div class="row" style="justify-content:space-between"><h2>${esc(u.title)}</h2><span class="pill">${live.length ? `${ud}/${live.length} done` : 'Coming soon'}</span></div>
              <p class="blurb">${esc(u.blurb)}</p>
              <div class="milestone"><b>Milestone</b><span>${esc(u.milestone)}</span></div>
              <div class="topics">${topicLinks(u)}</div>
            </div>
          </section>`; }).join('')}
      </div>`;
  }

  function renderTopic(id){
    const i = LIVE.findIndex(t => t.id === id), t = LIVE[i], u = t.unit;
    const prev = LIVE[i - 1], next = LIVE[i + 1];
    const last = u.topics.filter(x => !x.soon).slice(-1)[0].id === t.id;
    const answers = {};
    const order = t.quiz.map(q => { const o = q.a.map((_, k) => k); for (let k = o.length - 1; k > 0; k--) { const j = Math.floor(Math.random() * (k + 1)); [o[k], o[j]] = [o[j], o[k]]; } return o; });
    const st = work.steps[t.id] || [];
    app.innerHTML = `
      <div class="crumbs"><a href="#home">Modules</a> / Module ${u.num}: ${esc(u.title)}</div>
      <div class="lesson u-scope" style="${uvar(u)}">
        <article>
          <span class="u-band"><i>${u.num}</i>Module ${u.num}: ${esc(u.title)}</span><br><span class="label u" style="display:inline-block;margin-top:12px">Lesson ${t.id}</span><br>
          <h1>${esc(t.title)}</h1>
          <p class="summary">${esc(t.summary)}</p>
          ${(t.more || []).map(p => `<p class="more">${esc(p)}</p>`).join('')}
          ${t.example ? `<section class="block"><h2>${esc(t.example.title)}</h2><pre class="example">${esc(t.example.text)}</pre></section>` : ''}
          <section class="card block">
            <h2>Do this</h2><p class="sub">Check off each step as you finish it. Your checks are saved in this browser.</p>
            <ul class="todo">${t.steps.map((s, k) => `<li><label><input type="checkbox" id="step-${slug(t.id)}-${k}" data-step="${k}"${st[k] ? ' checked' : ''}><span>${esc(s)}</span></label></li>`).join('')}</ul>
          </section>
          ${t.fields ? `<section class="card block">
            <h2>Write it down</h2><p class="sub">What you type here is saved in this browser and collected on your <a href="#plan">My plan</a> page. You will reuse it in your video and written answers.</p>
            ${t.fields.map(f => `<div class="field"><label for="f-${f.key}">${esc(f.label)}</label><span class="hint">${esc(f.hint)}</span><textarea id="f-${f.key}" data-field="${f.key}" rows="${f.rows || 2}">${esc(work.fields[f.key] || '')}</textarea></div>`).join('')}
            <div class="saved" id="savedNote" aria-live="polite"></div>
          </section>` : ''}
          <section class="card block">
            <h2 style="margin-bottom:12px">Words to know</h2>
            <ul class="terms">${t.terms.map(([k, v]) => `<li><b>${esc(k)}:</b> ${esc(v)}</li>`).join('')}</ul>
          </section>
          <section class="card quiz" id="quiz">
            <div><h2 style="font-size:22px">Quick check</h2><p class="muted" style="margin:4px 0 0">Get all ${t.quiz.length} right to complete this lesson. You can retry as many times as you like.</p></div>
            ${t.quiz.map((q, qi) => `<div class="q" data-q="${qi}">
              <h3>${qi + 1}. ${esc(q.q)}</h3>
              <div class="choices">${order[qi].map((ai, pos) => `<button class="choice" data-a="${ai}"><b class="letter">(${'ABCD'[pos]})</b> ${esc(q.a[ai])}</button>`).join('')}</div>
              <div class="why" aria-live="polite"></div>
            </div>`).join('')}
            <div id="quizResult" aria-live="polite"></div>
          </section>
          ${last ? `<div class="milestone block"><b>Module ${u.num} milestone</b><span>${esc(u.milestone)}</span></div>` : ''}
          <nav class="pager">
            ${prev ? `<a class="btn" href="#${slug(prev.id)}">← ${prev.id} ${esc(prev.title)}</a>` : '<span></span>'}
            ${next ? `<a class="btn" href="#${slug(next.id)}">${next.id} ${esc(next.title)} →</a>` : '<a class="btn" href="#home">Back to all modules</a>'}
          </nav>
        </article>
        <aside class="side">
          <div class="card unitbox"><span class="label">Module ${u.num}</span><h3 style="margin:6px 0 10px">${esc(u.title)}</h3>
            <div style="display:grid;gap:6px">${u.topics.map(x => x.soon ? `<span class="muted">○ ${x.id} ${esc(x.title)}</span>` : `<a href="#${slug(x.id)}" style="text-decoration:none;color:var(--ink);${x.id === t.id ? 'font-weight:700' : ''}">${isDone(x.id) ? '✓' : '○'} ${x.id} ${esc(x.title)}</a>`).join('')}</div>
          </div>
          <a class="card lab-card" href="#plan"><span class="label">Your work so far</span><h3>My plan</h3><span class="muted">Everything you have written, in one place.</span></a>
        </aside>
      </div>`;
    app.querySelectorAll('[data-step]').forEach(c => c.addEventListener('change', () => {
      const a = work.steps[t.id] = work.steps[t.id] || []; a[+c.dataset.step] = c.checked; write(WKEY, work);
    }));
    app.querySelectorAll('[data-field]').forEach(x => x.addEventListener('input', () => {
      work.fields[x.dataset.field] = x.value; write(WKEY, work);
      const n = document.getElementById('savedNote'); if (n) n.textContent = 'Saved.';
    }));
    app.querySelectorAll('.q').forEach(qe => {
      const qi = +qe.dataset.q, q = t.quiz[qi];
      qe.querySelectorAll('.choice').forEach(b => b.addEventListener('click', () => {
        const ai = +b.dataset.a, right = ai === q.c;
        answers[qi] = right;
        qe.querySelectorAll('.choice').forEach(x => { x.disabled = true; x.classList.toggle('right', +x.dataset.a === q.c); });
        if (!right) b.classList.add('wrong');
        qe.querySelector('.why').innerHTML = `<b style="color:var(${right ? '--good' : '--bad'})">${right ? 'Correct.' : 'Not quite.'}</b> ${esc(q.why)}`;
        if (Object.keys(answers).length === t.quiz.length) finish();
      }));
    });
    function finish(){
      const score = Object.values(answers).filter(Boolean).length, all = score === t.quiz.length;
      if (all) { progress[t.id] = { passed: true, at: Date.now() }; save(); }
      const r = document.getElementById('quizResult');
      r.innerHTML = `<div class="result ${all ? 'ok' : 'no'}">${all ? `${score} of ${t.quiz.length} correct. Lesson ${t.id} complete. ` : `${score} of ${t.quiz.length} correct. Read the explanations, then try again. `}<button class="btn small" id="retry">${all ? 'Take it again' : 'Try again'}</button></div>`;
      r.querySelector('#retry').addEventListener('click', () => { renderTopic(t.id); document.getElementById('quiz').scrollIntoView(); });
    }
  }

  function renderRules(){
    app.innerHTML = `
      <div class="page-head"><span class="label">Official 2026 rules, in plain words</span>
        <h1>The rules you need to know</h1>
        <p>This is a summary to help you plan. The official rules can change each year, so read them yourself at <a href="${esc(INFO.site)}" target="_blank" rel="noopener">congressionalappchallenge.us</a> before you submit.</p></div>
      <div class="notice" style="margin-bottom:16px">${esc(INFO.note)}</div>
      <div class="rules">${window.CAC_RULES.map(r => `<section class="card"><h2>${esc(r.h)}</h2><ul>${r.items.map(x => `<li>${esc(x)}</li>`).join('')}</ul></section>`).join('')}</div>
      <div class="two" style="margin-top:16px">
        <section class="card"><h2 style="font-size:20px;margin-bottom:10px">Your video must include</h2><ol class="plain">${window.CAC_VIDEO.map(x => `<li>${esc(x)}</li>`).join('')}</ol></section>
        <section class="card"><h2 style="font-size:20px;margin-bottom:10px">Written questions to expect</h2><ol class="plain">${window.CAC_QUESTIONS.map(x => `<li>${esc(x)}</li>`).join('')}</ol></section>
      </div>
      <section class="card" style="margin-top:16px"><h2 style="font-size:20px;margin-bottom:10px">How winners are chosen</h2>
        <ul class="plain"><li>Quality of the idea, including creativity and originality.</li><li>Implementation of the idea, including user experience and design.</li><li>Demonstrated excellence of coding and programming skills.</li></ul>
        <p class="muted" style="margin:12px 0 0">Each Member of Congress and their office picks the winner for their district. Winning apps are featured on House.gov and on the challenge website.</p></section>`;
  }

  function renderPlan(){
    const filled = FIELDS.filter(f => (work.fields[f.key] || '').trim()).length;
    const text = () => FIELDS.map(f => `${f.label}:\n${(work.fields[f.key] || '').trim() || '(not written yet)'}`).join('\n\n');
    app.innerHTML = `
      <div class="page-head"><span class="label">Your work so far</span>
        <h1>My plan</h1>
        <p>Everything you write in the lessons shows up here. It is saved only in this browser on this device, so copy it into your build journal now and then.</p></div>
      <section class="card plan">
        <div class="row" style="justify-content:space-between"><span class="pill">${filled} of ${FIELDS.length} filled in</span><button class="btn small" id="copyPlan" type="button">Copy my plan</button></div>
        <div>${FIELDS.map(f => { const v = (work.fields[f.key] || '').trim(); return `<div class="plan-row"><span class="label">${esc(f.label)}</span><div class="v${v ? '' : ' empty'}">${v ? esc(v) : 'Not written yet.'}</div><a href="#${slug(f.topic.id)}" style="font-size:14px">${v ? 'Edit' : 'Write this'} in lesson ${f.topic.id}</a></div>`; }).join('')}</div>
      </section>`;
    const b = document.getElementById('copyPlan');
    b.addEventListener('click', () => {
      const done = () => { b.textContent = 'Copied'; setTimeout(() => { b.textContent = 'Copy my plan'; }, 1600); };
      const fallback = () => { const ta = document.createElement('textarea'); ta.value = text(); document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); done(); } catch (e) {} ta.remove(); };
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text()).then(done, fallback); else fallback();
    });
  }

  route();
})();
</script>
</body></html>
