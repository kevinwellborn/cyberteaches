<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>CyberTeaches Teacher Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: header, class picker row, then one class at a time: join details beside summary, full-width roster grid below */
:root{
  --bg:#EEF1EC; --panel:#FFFFFF; --panel-2:#F6F8F4; --ink:#1C292C; --muted:#5C6B6B; --line:#D5DCD4;
  --accent:#0F7B78; --accent-ink:#FFFFFF; --accent-soft:#D6EEEA;
  --sand:#E8D9B8; --sand-2:#E1D0AA; --rock:#8C7F69; --rock-2:#6F6453;
  --rover:#F2A93B; --wheel:#2E3A3D; --eye:#1C292C; --gem:#2BB3C9; --gem-hi:#8FE3EF; --flag:#D9443C;
  --b-move:#2F6FDE; --b-act:#C2417A; --b-loop:#D97E16; --b-logic:#2E9363;
  --good:#2E9363; --bad:#C8402F; --coin:#E9B21B; --coin-edge:#9A6F06; --crack:#A99A80;
  --f-display:"Bricolage Grotesque", "Trebuchet MS", system-ui, sans-serif;
  --f-body:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#141B1C; --panel:#1C2526; --panel-2:#222D2E; --ink:#E6EEEC; --muted:#9AABA9; --line:#33403F;
  --accent:#3FC1B8; --accent-ink:#0B1A1A; --accent-soft:#1D3A38;
  --sand:#4A4232; --sand-2:#433B2C; --rock:#26221C; --rock-2:#1A1713;
  --rover:#F5B24E; --wheel:#0E1415; --eye:#0E1415; --gem:#45C9DD; --gem-hi:#A6EEF7; --flag:#EF5B50;
  --b-move:#4B86EC; --b-act:#D85A92; --b-loop:#E39232; --b-logic:#3BA877;
  --good:#4CC28A; --bad:#EF6B57; --coin:#F2C14A; --coin-edge:#7A5604; --crack:#3D362B; color-scheme:dark }
}
:root[data-theme="dark"]{
  --bg:#141B1C; --panel:#1C2526; --panel-2:#222D2E; --ink:#E6EEEC; --muted:#9AABA9; --line:#33403F;
  --accent:#3FC1B8; --accent-ink:#0B1A1A; --accent-soft:#1D3A38;
  --sand:#4A4232; --sand-2:#433B2C; --rock:#26221C; --rock-2:#1A1713;
  --rover:#F5B24E; --wheel:#0E1415; --eye:#0E1415; --gem:#45C9DD; --gem-hi:#A6EEF7; --flag:#EF5B50;
  --b-move:#4B86EC; --b-act:#D85A92; --b-loop:#E39232; --b-logic:#3BA877;
  --good:#4CC28A; --bad:#EF6B57; --coin:#F2C14A; --coin-edge:#7A5604; --crack:#3D362B; color-scheme:dark
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{margin:0;color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:0 48px}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);margin:0;line-height:1.15;text-wrap:balance}
.wrap{max-width:1200px;margin:0 auto}
.topbar{display:flex;align-items:center;gap:14px;padding-block:16px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:800;font-size:20px;color:var(--ink);text-decoration:none}
.brand small{font-family:var(--f-body);font-weight:700;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-left:4px}
.spacer{flex:1}
.btn{border:2px solid var(--line);background:var(--panel);border-radius:10px;padding:8px 14px;font-weight:700;display:inline-flex;align-items:center;gap:8px;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn:disabled{opacity:.55;cursor:wait}
.label{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.muted{color:var(--muted)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px}
.hero{max-width:60ch;padding-block:40px}
.hero h1{font-size:clamp(30px,5vw,46px);font-weight:800}
.hero p{color:var(--muted);font-size:18px}
.classes{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:8px 0 18px}
.tab{border:2px solid var(--line);background:var(--panel);border-radius:99px;padding:6px 14px;font-weight:700}
.tab[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.tab.archived{opacity:.65;font-style:italic}
.btn.small{padding:4px 10px;font-size:14px;border-radius:99px}
.btn.danger{border-color:#c0392b;color:#c0392b}
.settings{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}.settings>div{border:2px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--panel)}.settings p{margin:4px 0 10px;font-size:14px}
.newclass{display:flex;gap:8px;flex-wrap:wrap}
.newclass input{border:2px solid var(--line);border-radius:10px;padding:8px 12px;background:var(--panel);min-width:0;width:220px;max-width:100%}
.top2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr);gap:16px;margin-bottom:16px}
.code{font-family:var(--f-mono);font-size:40px;font-weight:600;letter-spacing:.18em;margin:4px 0 8px}
.linkrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.linkrow code{font-family:var(--f-mono);font-size:13px;background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:6px 8px;overflow-wrap:anywhere;min-width:0;flex:1}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin-top:10px}
.stat b{display:block;font-family:var(--f-display);font-size:30px;font-variant-numeric:tabular-nums}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;border-radius:99px}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:16px;background:var(--panel)}
table{border-collapse:collapse;width:100%;font-size:14px;font-variant-numeric:tabular-nums}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:center;white-space:nowrap}
th{font-weight:700;color:var(--muted);font-size:12px;background:var(--panel-2)}
th.lesson{color:#fff;font-size:12px;letter-spacing:.06em;text-transform:uppercase}
td.name,th.name{text-align:left;position:sticky;left:0;background:var(--panel);z-index:1}
th.name{background:var(--panel-2)}
td.name b{display:block}
td.name small{color:var(--muted)}
.cell{display:inline-grid;place-items:center;width:30px;height:24px;border-radius:6px;font-size:11px;letter-spacing:-1px}
.s3{background:var(--accent);color:var(--accent-ink)}
.s2{background:color-mix(in srgb,var(--accent) 60%,var(--panel))}
.s1{background:color-mix(in srgb,var(--accent) 30%,var(--panel))}
.s0{color:var(--line)}
th.score,td.score{background:var(--panel-2);border-right:2px solid var(--line)}
small.rank{display:block;font-size:11px}
.insig{vertical-align:-0.25em;margin-right:2px}
.lb td.rank{white-space:nowrap}
.lbpanel:fullscreen .lb td.rank .insig{width:34px;height:34px}
.lbpanel{max-width:760px}
.lessonbtn{all:unset;cursor:pointer;color:#fff;font-weight:700;letter-spacing:.06em;white-space:nowrap;padding:2px 4px;border-radius:6px}
.lessonbtn:hover{text-decoration:underline}
.lessonbtn:focus-visible{outline:2px solid #fff;outline-offset:2px}
.lbtitle{font-size:20px;margin-bottom:8px}
.lbtabs{display:flex;gap:6px;margin:0 0 10px}
.lb td.l,.lb th.l{text-align:left}
.lb tr.place1 td:first-child b{color:var(--coin,#C9971A)}
.lb tr.place1 td,.lb tr.place2 td,.lb tr.place3 td{background:var(--panel-2)}
.lbpanel:fullscreen{max-width:none;padding:40px 8vw;overflow:auto;background:var(--panel)}
.lbpanel:fullscreen .lbtitle{font-size:44px;margin-bottom:20px}
.lbpanel:fullscreen .lb{font-size:26px}
.lbpanel:fullscreen .lb th{font-size:18px}
.legend{display:flex;gap:14px;flex-wrap:wrap;align-items:center;font-size:13px;color:var(--muted);margin:10px 2px}
.legend span{display:inline-flex;gap:6px;align-items:center}
.empty{padding:28px;text-align:center;color:var(--muted)}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:22px 0 8px}
.toolbar h2{font-size:22px}
.locks{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px}
.lockbtn{display:flex;align-items:center;gap:10px;border:2px solid var(--line);background:var(--panel);border-radius:12px;padding:8px 10px;font:inherit;color:var(--ink);cursor:pointer;text-align:left}
.lockbtn:hover{border-color:var(--accent)}
.lockbtn .lnum{flex:none;width:34px;height:34px;border-radius:9px;display:grid;place-items:center;color:#fff;font-weight:800;font-size:14px}
.lockbtn .ltitle{flex:1;min-width:0;font-weight:700;font-size:14px;line-height:1.2}
.lockbtn .lstate{flex:none;font-size:12px;font-weight:700;color:var(--accent)}
.lockbtn.off{background:var(--panel-2);border-style:dashed}
.lockbtn.off .ltitle,.lockbtn.off .lstate{color:var(--muted)}
.levels{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.lvlbtn{display:flex;flex-direction:column;align-items:flex-start;gap:2px;border:2px solid var(--c,var(--line));background:var(--cs,var(--panel));border-radius:12px;padding:8px 14px;font:inherit;color:var(--ink);cursor:pointer;min-width:150px}
body{border-top:6px solid var(--lv,var(--accent))}
.lvtag{display:inline-block;margin-left:8px;vertical-align:middle;border:1px solid var(--c);background:var(--cs);color:var(--c);border-radius:999px;padding:2px 10px;font-size:12px;font-weight:800;letter-spacing:.04em;text-transform:uppercase}
.keylesson .lvtag{font-size:12px}
.lvlbtn small{color:var(--muted);font-size:12px}
.lvlbtn.on{border-color:var(--c,var(--accent));background:var(--c,var(--accent));color:var(--ci,var(--accent-ink))} .lvlbtn.on small{color:inherit;opacity:.85}
.tstat{font-weight:700;border-radius:999px;padding:2px 10px;font-size:13px;background:var(--panel-2)} .tstat.pending{background:#FFF1C9;color:#7A5200} .tstat.approved{background:#D8F3E4;color:#0B5E3C} .tstat.rejected{background:#FBDAD5;color:#8A1C10}
.stulvl{display:block;margin-top:4px;font:inherit;font-size:12px;border:1px solid var(--c,var(--line));border-radius:8px;padding:2px 6px;background:var(--cs,var(--panel));color:var(--c,var(--muted));font-weight:700;max-width:170px}
.note{margin-top:18px;font-size:14px}
.err{color:var(--bad);font-weight:700}
.auth{max-width:420px;margin-top:20px}
.auth .field{display:block;width:100%;margin:4px 0 12px;font-size:17px;padding:8px 12px;border:2px solid var(--line);border-radius:10px;background:var(--panel-2);color:var(--ink)}
.auth .field:focus{border-color:var(--accent);outline:none}
.auth .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.linkbtn{background:none;border:0;padding:0;color:var(--accent);font-weight:700;text-decoration:underline}
.or{display:flex;align-items:center;gap:10px;margin:16px 0;color:var(--muted);font-size:14px}
.or::before,.or::after{content:"";flex:1;border-top:1px solid var(--line)}
.okmsg{color:var(--good);font-weight:700}
.logins{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.6fr);gap:16px;align-items:start}
.logins textarea{display:block;width:100%;min-height:150px;margin:6px 0 10px;border:2px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--panel-2);color:var(--ink);font:inherit;resize:vertical}
.logins textarea:focus{border-color:var(--accent);outline:none}
.logins td,.logins th{text-align:left}
.logins td.pw,.logins td.un{font-family:var(--f-mono);font-size:14px}
.logins td.acts{text-align:right}
.btn.sm{padding:4px 10px;font-size:13px;border-radius:8px}
@media (max-width:760px){ .logins{grid-template-columns:minmax(0,1fr)} }
.keylesson{margin:18px 0 6px;font-size:18px}
.keygrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px;align-items:start}
.keycard{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;min-width:0}
.keycard h3{font-size:16px;margin:0 0 2px}
.keycard .meta{font-size:13px;color:var(--muted);margin-bottom:8px}
.keycard pre{margin:0;background:var(--panel-2);border-radius:10px;padding:10px 12px;font-family:var(--f-mono);font-size:13px;line-height:1.55;white-space:pre-wrap;overflow-wrap:anywhere;color:var(--ink)}
.keycard a{display:inline-block;margin-top:8px;font-size:14px;font-weight:700;color:var(--accent)}
@media (max-width:820px){ .top2{grid-template-columns:minmax(0,1fr)} }
</style>
</head><body>
<div class="wrap">
  <header class="topbar">
    <a class="brand" href="./">
      <svg viewBox="0 0 40 40" width="34" height="34" aria-hidden="true"><rect width="40" height="40" rx="10" fill="var(--accent)"/><rect x="9" y="11" width="5" height="19" rx="2.5" fill="var(--wheel)"/><rect x="26" y="11" width="5" height="19" rx="2.5" fill="var(--wheel)"/><rect x="12.5" y="12" width="15" height="17" rx="4" fill="var(--rover)"/><circle cx="20" cy="17" r="3.2" fill="#fff"/><circle cx="20" cy="16.4" r="1.6" fill="var(--eye)"/></svg>
      CyberTeaches Academy <small>Teacher</small>
    </a>
    <div class="spacer"></div>
    <a class="btn" href="resources/" style="text-decoration:none">Teacher resources</a>
    <a class="btn" href="quiz/host.html" style="text-decoration:none">Quiz Battle</a>
    <div id="acct" style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"></div>
  </header>
  <main id="app"><p class="muted">Loading…</p></main>
</div>
<script src="course.js?v=13"></script>
<script src="firebase-config.js"></script>
<script src="cloud.js?v=16"></script>
<script>
const $=(s,r=document)=>r.querySelector(s);
const esc=t=>String(t==null?'':t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const app=$('#app'), acct=$('#acct');
const openUnits=new Set();  // lessons expanded in the progress table
let classes=[], showArchived=false, keepArchived=false, current=null, roster=[], stopRoster=null, stopClasses=null, uid=null, tw0=null, duelRows=[], stopDuel=null, boardRows=[], stopBoard=null, lbTab='all';
const LEVEL_HELP={easy:'Small maps, short programs', medium:'Mid-size maps, a step up', hard:'The full challenge'};
const pick={ get(){ try{ return localStorage.getItem('cyberteaches:teacherClass') }catch(e){ return null } }, set(v){ try{ localStorage.setItem('cyberteaches:teacherClass',v) }catch(e){} } };

function signInView(mode){
  mode=mode||'in';
  const titles={in:'Sign in', up:'Create a teacher account', reset:'Reset your password'};
  app.innerHTML=`<section class="hero"><span class="label">For teachers</span>
    <h1 style="margin-top:8px">See how your class is doing, puzzle by puzzle.</h1>
    <p>Create a class, then share its code or link with students, or make each student a username and password. As students solve puzzles, their stars show up here.</p>
    <form class="panel auth" id="authForm" novalidate><h2 style="font-size:22px;margin-bottom:12px">${titles[mode]}</h2>
      ${mode==='up'?'<label class="label" for="tName">Your name</label><input class="field" id="tName" autocomplete="name" maxlength="60" placeholder="e.g. Ms. Rivera">':''}
      <label class="label" for="tEmail">Email</label><input class="field" id="tEmail" type="email" autocomplete="email">
      ${mode!=='reset'?`<label class="label" for="tPass">Password</label><input class="field" id="tPass" type="password" autocomplete="${mode==='up'?'new-password':'current-password'}" minlength="8">`:''}
      <div class="row"><button class="btn primary" id="authGo">${mode==='in'?'Sign in':mode==='up'?'Create account':'Email me a reset link'}</button>
        ${mode==='in'?'<button type="button" class="linkbtn" data-mode="reset">Forgot password?</button>':''}</div>
      <p id="authMsg" role="alert" style="margin:10px 0 0"></p>
      <p class="muted" style="margin:8px 0 0;font-size:15px">${mode==='in'?'New here? <button type="button" class="linkbtn" data-mode="up">Create a teacher account</button>':'<button type="button" class="linkbtn" data-mode="in">Back to sign in</button>'}</p>
      ${mode!=='reset'?`<div class="or"><span>or</span></div><button type="button" class="btn" id="si" style="width:100%;justify-content:center">${G_ICON}Sign in with Google</button>`:''}
    </form></section>`;
  app.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>signInView(b.dataset.mode));
  const msg=$('#authMsg'), err=t=>{ msg.className='err'; msg.textContent=t };
  if($('#si')) $('#si').onclick=()=>Cloud.signIn().catch(e=>err(e.code==='auth/unauthorized-domain' ? 'This web address is not in Firebase Authorized domains yet.' : 'Sign-in did not work. Try again.'));
  $('#authForm').addEventListener('submit',async e=>{
    e.preventDefault();
    const email=$('#tEmail').value.trim(), pass=$('#tPass')?$('#tPass').value:'', name=$('#tName')?$('#tName').value.trim():'';
    if(mode==='up'&&!name) return err('Type your name. Students and other teachers see it.');
    if(!/^\S+@\S+\.\S+$/.test(email)) return err('Type your email address.');
    if(/@students\.cyberteaches\.com$/i.test(email)) return err('That is a student login. Students sign in on the course page.');
    if(mode==='up'&&pass.length<8) return err('Use a password with at least 8 characters.');
    if(mode==='in'&&!pass) return err('Type your password.');
    $('#authGo').disabled=true; msg.className='muted'; msg.textContent=mode==='reset'?'Sending…':'Signing in…';
    try{
      if(mode==='in') await Cloud.signInTeacher(email,pass);
      else if(mode==='up') await Cloud.createTeacher(name,email,pass);
      else { await Cloud.resetTeacherPassword(email).catch(e=>{ if(e.code!=='auth/user-not-found') throw e });
        msg.className='okmsg'; msg.textContent='If there is an account for '+email+', a reset link is on its way. Check your inbox and spam folder.' }
    }catch(e){ console.error(e);
      err(e.code==='auth/email-already-in-use' ? 'There is already an account with that email. Sign in instead, or use Forgot password.'
        : e.code==='auth/weak-password' ? 'Use a password with at least 8 characters.'
        : e.code==='auth/too-many-requests' ? 'Too many tries. Wait a few minutes, then try again.'
        : e.code==='auth/network-request-failed' ? 'Check your internet connection and try again.'
        : e.code==='auth/invalid-email' ? 'That email address does not look right.'
        : mode==='in' ? 'That email and password did not match. Try again, or use Forgot password.'
        : 'That did not work. Try again in a moment.') }
    if($('#authGo')) $('#authGo').disabled=false;
  });
}
const G_ICON='<svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="#4285F4" d="M23 12.3c0-.8-.1-1.6-.2-2.3H12v4.4h6.2a5.3 5.3 0 0 1-2.3 3.5v2.9h3.7c2.2-2 3.4-5 3.4-8.5z"/><path fill="#34A853" d="M12 23.5c3.1 0 5.7-1 7.6-2.8l-3.7-2.9c-1 .7-2.4 1.1-3.9 1.1-3 0-5.5-2-6.4-4.7H1.8v3A11.5 11.5 0 0 0 12 23.5z"/><path fill="#FBBC05" d="M5.6 14.2a6.9 6.9 0 0 1 0-4.4v-3H1.8a11.5 11.5 0 0 0 0 10.4z"/><path fill="#EA4335" d="M12 5.1c1.7 0 3.2.6 4.4 1.7l3.3-3.3A11.5 11.5 0 0 0 1.8 6.8l3.8 3C6.5 7.1 9 5.1 12 5.1z"/></svg>';
function studentAccount(){
  app.innerHTML=`<section class="hero"><span class="label">For teachers</span><h1 style="margin-top:8px">This is a student login.</h1>
    <p>The teacher dashboard needs a teacher account. Sign out, then sign in with your teacher email or Google account.</p>
    <button class="btn primary" id="so">Sign out</button></section>`;
  $('#so').onclick=()=>Cloud.signOut();
}
function notConfigured(){
  app.innerHTML=`<section class="hero"><span class="label">Setup needed</span><h1 style="margin-top:8px">Sign-in is not switched on yet.</h1>
    <p>Add your Firebase settings to <code>firebase-config.js</code> to turn on student sign-in and this dashboard. Until then, students can still play, and progress saves in their own browser.</p></section>`;
}
function renderAcct(c){
  acct.innerHTML='';
  if(!c.user) return;
  acct.insertAdjacentHTML('beforeend',`<span class="muted" style="font-size:14px">${esc(c.user.displayName||c.user.email)}</span>`);
  const o=document.createElement('button'); o.className='btn'; o.textContent='Sign out'; o.onclick=()=>Cloud.signOut(); acct.appendChild(o);
}

function dashboard(admin){
  app.innerHTML=`${admin?'<section id="adminview" class="panel" style="margin-top:6px"></section>':''}<div class="toolbar" style="margin-top:6px"><h2>Your classes</h2></div>
    <div class="classes" id="classes"></div>

// ---------- answer key (teachers only; answer-key.js is loaded after sign-in) ----------
const KEY_LABEL={forward:'move forward',left:'turn left',right:'turn right',collect:'collect crystal',fire:'fire cannon',blast:'blast wall ahead',until:'repeat until at flag',untilclear:'repeat until no tanks left',iftank:'if tank ahead',repeatvar:'repeat steps times'};
const KEY_COND={ahead:'path ahead',left:'path to the left',right:'path to the right',crystal:'crystal here',cracked:'cracked wall ahead',tank:'tank ahead'};
const KEY_DRIVE={forward:'↑ forward',left:'← turn left',right:'→ turn right',fire:'Space fire'};
function keyLines(list,ind){
  return list.flatMap(n=>{ const p='   '.repeat(ind);
    if(n.type==='repeat') return [p+'repeat '+n.n+' times',...keyLines(n.body,ind+1)];
    if(n.type==='set') return [p+'set steps to '+n.n];
    if(n.type==='change') return [p+'change steps by '+(n.d>0?'+':'')+n.d];
    if(n.type==='ifelse') return [p+'if '+KEY_COND[n.cond],...keyLines(n.body,ind+1),p+'else',...(n.elseBody.length?keyLines(n.elseBody,ind+1):[p+'   (nothing)'])];
    if(n.body) return [p+KEY_LABEL[n.type],...keyLines(n.body,ind+1)];
    return [p+KEY_LABEL[n.type]] });
}
const keyCount=list=>list.reduce((s,n)=>s+1+keyCount(n.body||[])+keyCount(n.elseBody||[]),0);
let keyData=null;
// The answer key file is encrypted. The secret lives in Firestore (config/answerKey), readable by approved teachers only.
async function loadKey(){
  if(keyData) return keyData;
  const cfg=await Cloud.getConfig('answerKey'); if(!cfg||!cfg.secret) throw new Error('no-secret');
  await new Promise((ok,fail)=>{ if(window.ANSWER_KEY_ENC) return ok(); const sc=document.createElement('script'); sc.src='answer-key.js?v=11'; sc.onload=ok; sc.onerror=fail; document.head.appendChild(sc) });
  const b64=x=>Uint8Array.from(atob(x),c=>c.charCodeAt(0)), enc=window.ANSWER_KEY_ENC, te=new TextEncoder();
  const base=await crypto.subtle.importKey('raw',te.encode(cfg.secret),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(enc.salt),iterations:100000,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
  const plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(enc.iv)},key,b64(enc.data));
  keyData=JSON.parse(new TextDecoder().decode(plain)); return keyData;
}
async function toggleKey(){
  const btn=$('#keyBtn'), box=$('#keybody'), open=btn.getAttribute('aria-expanded')==='true';
  if(open){ box.innerHTML=''; btn.textContent='Show answers'; btn.setAttribute('aria-expanded','false'); return }
  btn.disabled=true; box.innerHTML='<p class="muted">Loading…</p>';
  try{ await loadKey() }catch(e){ console.error(e); box.innerHTML=`<p class="err">${e.message==='no-secret'?'The answer key is not set up yet. The site admin needs to save the answer key secret on this page.':'Could not load the answer key. Check your connection and try again.'}</p>`; btn.disabled=false; return }
  box.innerHTML=UNITS.map(u=>LEVELS_AVAILABLE.map(v=>`<h3 class="keylesson">Lesson ${u.n}: ${esc(u.title)}<span class="lvtag" style="${levelStyle(v)}">${LEVEL_NAMES[v]} level</span></h3><div class="keygrid">${levelsOf(v,u.n).map(l=>{
    const prog=keyData[l.n]||[];
    const body = l.drive ? prog.map((n,i)=>(i+1+'. ').padStart(4,' ')+KEY_DRIVE[n.type]).join('\n') : keyLines(prog,0).join('\n');
    const meta = l.drive ? `Drive mode · ${prog.length} moves (3 stars at ${l.ideal} or fewer)` : `${keyCount(prog)} blocks · goal ${l.ideal}`;
    return `<article class="keycard"><h3>${u.n}.${l.k} ${esc(l.title)}</h3><div class="meta">${meta}</div><pre>${esc(prog.length?body:'No solution saved yet.')}</pre><a href="./#puzzle-${l.n}" target="_blank" rel="noopener">Open puzzle</a></article>` }).join('')}</div>`).join('')).join('')
    + '<p class="muted" style="margin-top:14px;font-size:14px">Other correct programs also work. These are one way to reach the block goal.</p>';
  btn.disabled=false; btn.textContent='Hide answers'; btn.setAttribute('aria-expanded','true');
}

let logins=[], stopLogins=null;
const WORDS=['rover','comet','orbit','pixel','robot','rocket','planet','moon','laser','cactus','tiger','panda','maple','river','cloud','ocean','sunny','zebra','lemon','mango','piano','falcon','galaxy','nova','lunar','crater','otter','koala','bison','canyon','meadow','summit','harbor','island','jungle','glacier'];
const rnd=n=>{ const a=new Uint32Array(1); crypto.getRandomValues(a); return a[0]%n };
const newPassword=()=>WORDS[rnd(WORDS.length)]+(10+rnd(90));
function makeUsername(name, taken){
  const parts=name.toLowerCase().normalize('NFD').replace(/[^a-z\s]/g,'').split(/\s+/).filter(Boolean);
  let base=parts.length?(parts[0]+(parts.length>1?parts[parts.length-1][0]:'')).slice(0,16):'student';
  let u=base, i=2; while(taken.has(u)) u=base+(i++);
  taken.add(u); return u;
}

  $('#deleteBtn').onclick=async()=>{
    const typed=prompt(`This deletes "${c.name||c.code}" and all of its student logins for good. Type the class name to confirm:`);
    if(typed===null) return; if(typed.trim().toLowerCase()!==(c.name||c.code).trim().toLowerCase()){ $('#setErr').textContent='The name did not match. Nothing was deleted.'; return }
    $('#setErr').textContent=''; $('#deleteBtn').disabled=true; $('#archiveBtn').disabled=true;
    if(stopRoster) stopRoster(); if(stopLogins) stopLogins(); stopRoster=stopLogins=null;
    try{ await Cloud.deleteClass(c.code, m=>{ const el=$('#delMsg'); if(el) el.textContent=m }); current=null; pick.set('') }
    catch(e){ console.error(e); const el=$('#setErr'); if(el) el.textContent='Could not delete everything. Try again.'; const d=$('#deleteBtn'); if(d) d.disabled=false; const a=$('#archiveBtn'); if(a) a.disabled=false }
  };
  // Writes go straight to Firestore; the class snapshot (with local changes applied at once) redraws the buttons.
  const FV=firebase.firestore.FieldValue, cref=Cloud.db.collection('classes').doc(c.code);
  let saves=0;
  // Each change goes two ways: the Firestore SDK (redraws this page at once) and a plain HTTPS request (rest),
  // which gets through some school filters that stall the SDK. Whichever the server confirms first counts.
  const save=(data, rest)=>{ const n=++saves; let done=false;
    const say=(t,ok)=>{ const e=$('#lockErr'); if(e && n===saves){ e.textContent=t; e.style.color=ok?'#0B5E3C':'' } };
    const ok=()=>{ if(done) return; done=true; clearTimeout(slow); say('Saved ✓ Students will see it when they reload or within a few minutes.',true) };
    say('Saving…',true);
    const slow=setTimeout(()=>{ if(!done) say('Still saving… Your network may be slowing this down. Keep this page open until it says Saved.') },8000);
    cref.update(data).then(ok, e=>{ console.error(e); if(!done) say('Could not save ('+(e.code||e.message)+'). Try again.') });
    Cloud.restUpdate('classes/'+c.code, rest||data).then(ok, e=>{ console.error(e);
      if(!done){ clearTimeout(slow); say('Not saved yet ('+(e.status?e.status+' ':'')+(e.message||e.name||'network error')+'). Still trying… keep this page open.') } }) };
  const lockedNow=()=>[...document.querySelectorAll('#locks .lockbtn.off')].map(b=>+b.dataset.unit);
  $('#locks').onclick=e=>{ const b=e.target.closest('.lockbtn'); if(!b) return; const u=+b.dataset.unit, off=b.classList.contains('off');
    b.classList.toggle('off'); save({locked: off ? FV.arrayRemove(u) : FV.arrayUnion(u)}, {locked: lockedNow()}) };
  $('#levels').onclick=e=>{ const b=e.target.closest('.lvlbtn'); if(!b) return; save({level: b.dataset.level}) };
  tw0=$('#progressTable'); tw0.onchange=e=>{ const sel=e.target.closest('.stulvl'); if(!sel) return; const k='levels.'+sel.dataset.uid;
    save({[k]: sel.value ? sel.value : FV.delete()}, {[k]: sel.value || undefined}) };
  $('#unlockAll').onclick=()=>save({locked: []});
  $('#lockAll').onclick=()=>save({locked: UNITS.map(u=>u.n)});
  const tw=$('#progressTable'); tw.onclick=e=>{
    const rm=e.target.closest('.rmstu');
    if(rm){ const st=roster.find(x=>x.uid===rm.dataset.uid); if(!st) return;
      if(!confirm('Remove '+(st.name||'this student')+' from '+(c.name||c.code)+'?\n\nUse this when a student joined the wrong class. Their stars are kept in their own account. If they are still in this class, they will show up again the next time they play.')) return;
      rm.disabled=true;
      Promise.all([cref.collection('students').doc(st.uid).delete(), cref.collection('board').doc(st.uid).delete().catch(()=>{})])
        .catch(err=>{ console.error(err); rm.disabled=false; alert('Could not remove. Check your connection and try again.') });
      return }
    const b=e.target.closest('.lessonbtn'); if(!b) return; const u=+b.dataset.unit;
    openUnits.has(u)?openUnits.delete(u):openUnits.add(u); const x=tw.scrollLeft; tw.innerHTML=table(); tw.scrollLeft=x;
    const nb=tw.querySelector(`.lessonbtn[data-unit="${u}"]`); if(nb) nb.focus() };
  $('#duelToggle').onclick=()=>save({duels: !c.duels});
  const dfs=$('#duelFull'); if(dfs) dfs.onclick=()=>{ const el=$('#duelPanel'); (el.requestFullscreen||el.webkitRequestFullscreen||(()=>{})).call(el) };
  $('#duelReset').onclick=async()=>{
    if(!confirm('Reset the Duel scoreboard for '+(c.name||c.code)+'?\n\nEvery student goes back to 3 trophies plus 1 for every 10 lesson stars, with no wins or losses. Stars and scores are not changed.')) return;
    try{ for(const sub of ['duelBoard','duels']){ const s=await cref.collection(sub).get(); await Promise.all(s.docs.map(d=>d.ref.delete())) } }
    catch(e){ console.error(e); alert('Could not reset everything. Check your connection and try again.') } };
  const lbt=$('#lbPanel .lbtabs'); if(lbt) lbt.onclick=e=>{ const b=e.target.closest('[data-tab]'); if(!b) return; lbTab=b.dataset.tab;
    lbt.querySelectorAll('[data-tab]').forEach(x=>x.setAttribute('aria-pressed',String(x.dataset.tab===lbTab))); $('#lbBox').innerHTML=leaderboard() };
  const fs=$('#lbFull'); if(fs) fs.onclick=()=>{ const el=$('#lbPanel'); (el.requestFullscreen||el.webkitRequestFullscreen||(()=>{})).call(el) };
}
// Same ranking students see in the app: by stars, then puzzles solved. Names are first name + last initial so it is safe to project.
function leaderboard(){
  const c=classes.find(x=>x.code===current)||{};
  const short=n=>{ const w=String(n||'Student').trim().split(/\s+/); return w.length>1 ? w[0]+' '+w[w.length-1][0]+'.' : w[0] };
  if(lbTab==='today'){
    // Stars earned today (each student's leaderboard row keeps today's starting total). Updates live.
    const today=Cloud.today(), inClass=new Set(roster.map(s=>s.uid));
    const rows=boardRows.filter(r=>inClass.has(r.uid) && r.day===today).map(r=>({name:r.name||'Student', today:Math.max(0,(r.stars||0)-(r.dayBase||0))}))
      .filter(r=>r.today>0).sort((a,b)=>b.today-a.today || a.name.localeCompare(b.name));
    if(!rows.length) return '<p class="muted" style="margin:8px 0">No stars earned yet today. The board fills in live as students solve puzzles, and starts again at 0 tomorrow.</p>';
    let place=0, prev=null;
    return `<table class="lb"><thead><tr><th>#</th><th class="l">Student</th><th>Stars today</th></tr></thead><tbody>${rows.map((r,i)=>{
      if(r.today!==prev){ place=i+1; prev=r.today }
      return `<tr class="${place<=3?'place'+place:''}"><td><b>${place===1?'👑':place}</b></td><td class="l"><b>${esc(r.name)}</b></td><td><b>+${r.today}</b> ★</td></tr>` }).join('')}</tbody></table>`;
  }
  const rows=roster.map(s=>{ const p=s.progress||{}; const sl=studentLevel(c,s); return {name:short(s.name), stars:totalStars(p), solved:levelsOf(sl).filter(l=>p[l.n]).length, total:levelsOf(sl).length} })
    .sort((a,b)=>b.stars-a.stars || b.solved-a.solved || a.name.localeCompare(b.name));
  let place=0, prev=null;
  return `<table class="lb"><thead><tr><th>#</th><th class="l">Student</th><th class="l">Rank</th><th>Stars</th><th>Solved</th></tr></thead><tbody>${rows.map((r,i)=>{
    if(r.stars!==prev){ place=i+1; prev=r.stars }
    return `<tr class="${place<=3&&r.stars?'place'+place:''}"><td><b>${place}</b></td><td class="l"><b>${esc(r.name)}</b></td><td class="l rank">${insigniaSvg(rankFor(r.stars).i)} ${rankFor(r.stars).title}</td><td><b>${r.stars}</b> ★</td><td>${r.solved}/${r.total}</td></tr>` }).join('')}</tbody></table>`;
}
// Duel scoreboard: everyone on the roster, ranked by Duel trophies (3 + 1 per 10 stars + duel results). Same formula as duel.js and the rules.
function duelTable(){
  const short=n=>{ const w=String(n||'Student').trim().split(/\s+/); return w.length>1 ? w[0]+' '+w[w.length-1][0]+'.' : w[0] };
  const by={};
  roster.forEach(s=>{ by[s.uid]={name:short(s.name), stars:totalStars(s.progress||{}), net:0, free:0, wins:0, losses:0, ties:0} });
  duelRows.forEach(r=>{ by[r.uid]={stars:0, ...(by[r.uid]||{}), net:r.net||0, free:r.free||0, wins:r.wins||0, losses:r.losses||0, ties:r.ties||0, name:(by[r.uid]||{}).name||r.name||'Student'} });
  const rows=Object.values(by).map(r=>({...r, trophies:3+Math.floor(r.stars/10)+r.net+r.free}))
    .sort((a,b)=>b.trophies-a.trophies || b.wins-a.wins || a.name.localeCompare(b.name));
  if(!rows.length) return '<p class="muted">No students yet.</p>';
  let place=0, prev=null;
  return `<table class="lb"><thead><tr><th>#</th><th class="l">Student</th><th>Trophies</th><th>Won</th><th>Lost</th><th>Tied</th></tr></thead><tbody>${rows.map((r,i)=>{
    if(r.trophies!==prev){ place=i+1; prev=r.trophies }
    return `<tr class="${place<=3?'place'+place:''}"><td><b>${place}</b></td><td class="l"><b>${esc(r.name)}</b></td><td><b>${r.trophies}</b> 🏆</td><td>${r.wins}</td><td>${r.losses}</td><td>${r.ties}</td></tr>` }).join('')}</tbody></table>`;
}
function table(){
  // Lessons start collapsed to just their Score (out of 100, see lessonScore in course.js). Clicking a lesson shows its puzzles.
  // Columns show the class level's puzzles; a student on another level gets their own level's score and a note.
  const c=classes.find(x=>x.code===current)||{}, cl=classLevel(c);
  const lv=u=>openUnits.has(u.n)?levelsOf(cl,u.n):[];
  const head1=UNITS.map(u=>{ const o=openUnits.has(u.n); return `<th class="lesson" colspan="${lv(u).length+1}" style="background:${u.color}"><button class="lessonbtn" data-unit="${u.n}" aria-expanded="${o}" title="${o?'Hide':'Show'} each puzzle">${o?'▾':'▸'} L${u.n}${o?': '+esc(u.title):''}</button></th>` }).join('');
  const head2=UNITS.map(u=>lv(u).map(l=>`<th title="${esc(l.title)}">${l.unit}.${l.k}</th>`).join('')+`<th class="score" title="Lesson ${u.n}: ${esc(u.title)}. Score out of 100">Score</th>`).join('');
  const rows=roster.map(s=>{
    const p=s.progress||{}, sl=studentLevel(c,s), other=sl!==cl, done=levelsOf(sl).filter(l=>p[l.n]).length, stars=totalStars(p);
    const cells=UNITS.map(u=>lv(u).map(l=>{ const st=p[l.n]||0; return other ? '<td><span class="cell s0" title="This student is on another level">–</span></td>' : `<td><span class="cell s${st}" title="${esc(l.title)}: ${st?st+' star'+(st>1?'s':''):'not solved'}">${st?'★'.repeat(st):'·'}</span></td>` }).join('')
      +`<td class="score"><b>${lessonScore(p,u.n,sl)}</b></td>`).join('');
    const pick=`<select class="stulvl" data-uid="${esc(s.uid)}" aria-label="Level for ${esc(s.name)}" style="${levelStyle(sl)}"><option value="">Class level (${LEVEL_NAMES[cl]})</option>${LEVELS_AVAILABLE.map(v=>`<option value="${v}"${(c.levels||{})[s.uid]===v?' selected':''}>${LEVEL_NAMES[v]}</option>`).join('')}</select>`;
    return `<tr><td class="name"><b>${esc(s.name)}</b><small>${esc(s.email||(s.username?'Username: '+s.username:''))}</small>${pick} <button class="btn sm rmstu" data-uid="${esc(s.uid)}" title="Take this student off this class list">Remove</button></td>${cells}<td><b>${done}</b>/${levelsOf(sl).length}</td><td><b>${stars}</b> ★<small class="muted rank">${insigniaSvg(rankFor(stars).i,16)} ${rankFor(stars).title}</small></td><td class="muted">${ago(s.updatedAt)}</td></tr>`;
  }).join('');
  return `<table><thead><tr><th class="name" rowspan="2">Student</th>${head1}<th rowspan="2">Solved</th><th rowspan="2">Stars and rank</th><th rowspan="2">Last active</th></tr><tr>${head2}</tr></thead><tbody>${rows}</tbody></table>`;
}
function downloadCsv(c){
  const q=v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"';
  const cl=classLevel(c), cols=levelsOf(cl);
  const lines=[['Student','Email or username','Level',...cols.map(l=>'L'+l.unit+'.'+l.k+' '+l.title),...UNITS.map(u=>'Lesson '+u.n+' score'),'Solved','Stars','Rank','Last active'].map(q).join(',')];
  roster.forEach(s=>{ const p=s.progress||{}, stars=totalStars(p), sl=studentLevel(c,s); lines.push([s.name,s.email||s.username,LEVEL_NAMES[sl],...cols.map(l=>sl===cl?(p[l.n]||0):''),...UNITS.map(u=>lessonScore(p,u.n,sl)),levelsOf(sl).filter(l=>p[l.n]).length,stars,rankFor(stars).title,s.updatedAt&&s.updatedAt.toDate?s.updatedAt.toDate().toISOString():''].map(q).join(',')) });
  const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([lines.join('\n')],{type:'text/csv'})); a.download=(c.name||c.code).replace(/[^a-z0-9]+/gi,'-')+'-progress.csv'; document.body.appendChild(a); a.click(); a.remove();
}

if(!window.Cloud || !Cloud.enabled) notConfigured();
else Cloud.onChange(c=>{
  if(!c.enabled){ notConfigured(); return }
  if(!c.ready) return;
  renderAcct(c);
  const u=c.user?c.user.uid:null;
  if(u===uid && app.dataset.ready) return;
  uid=u; app.dataset.ready='1';
  if(stopRoster){ stopRoster(); stopRoster=null } if(stopDuel){ stopDuel(); stopDuel=null } if(stopBoard){ stopBoard(); stopBoard=null } if(stopClasses){ stopClasses(); stopClasses=null } if(stopLogins){ stopLogins(); stopLogins=null }
  current=null;
  if(stopStatus){ stopStatus(); stopStatus=null }
  if(!u) signInView(); else if(Cloud.isStudentLogin(c.user)) studentAccount(); else if(Cloud.isAdmin(c.user)) dashboard(true); else gate(c.user);
});
// Teachers need Kevin's approval before they can use the dashboard (teachers/{uid}.status).
let stopStatus=null, shownStatus=null;
function gate(user){
  app.innerHTML='<p class="muted">Checking your access…</p>'; shownStatus=null;
  stopStatus=Cloud.watchTeacherStatus((t,err)=>{
    if(err){ app.innerHTML='<section class="hero"><span class="label">For teachers</span><h1 style="margin-top:8px">Could not check your access.</h1><p>Check your internet connection and reload. If this keeps happening, the Firestore rules may not be published yet.</p></section>'; return }
    const st=t?t.status:'none'; if(st===shownStatus) return; shownStatus=st;
    if(st==='approved') dashboard(false);
    else if(st==='pending') waitView(t);
    else if(st==='rejected') app.innerHTML=`<section class="hero"><span class="label">For teachers</span><h1 style="margin-top:8px">This account was not approved.</h1><p>Teacher access for <b>${esc(user.email)}</b> was declined. If you are a teacher and this is a mistake, email the site admin. Students use the course page, not this one.</p><button class="btn" id="so">Sign out</button></section>`;
    else requestView(user);
    const so=$('#so'); if(so) so.onclick=()=>Cloud.signOut();
  });
}
function requestView(user){
  app.innerHTML=`<section class="hero"><span class="label">For teachers</span><h1 style="margin-top:8px">Ask for teacher access</h1>
    <p>The Teacher Dashboard is for teachers only. Tell us who you are and the site admin will approve your account, usually within a day. You are signed in as <b>${esc(user.email)}</b>.</p>
    <form class="panel auth" id="reqForm" novalidate>
      <label class="label" for="rName">Your name</label><input class="field" id="rName" maxlength="60" autocomplete="name" placeholder="e.g. Ms. Rivera" value="${esc(user.displayName||'')}">
      <label class="label" for="rSchool">School</label><input class="field" id="rSchool" maxlength="80" autocomplete="organization" placeholder="e.g. Lincoln High School">
      <div class="row"><button class="btn primary" id="reqGo">Send request</button><button type="button" class="linkbtn" id="so">Sign out</button></div>
      <p id="reqMsg" role="alert" class="err" style="margin:10px 0 0"></p></form></section>`;
  $('#reqForm').addEventListener('submit',async e=>{ e.preventDefault();
    const name=$('#rName').value.trim(), school=$('#rSchool').value.trim(), msg=$('#reqMsg');
    if(!name) return msg.textContent='Type your name.'; if(!school) return msg.textContent='Type your school.';
    $('#reqGo').disabled=true; msg.textContent='';
    try{ await Cloud.requestTeacher(name,school) }catch(err){ console.error(err); msg.textContent='Could not send the request. Check your connection and try again.'; $('#reqGo').disabled=false }
  });
}
function waitView(t){
  app.innerHTML=`<section class="hero"><span class="label">For teachers</span><h1 style="margin-top:8px">Thanks, ${esc(t.name||'')}. Your request is in.</h1>
    <p>The site admin will approve teacher access for <b>${esc(t.email||'')}</b> (${esc(t.school||'')}). This page updates by itself when that happens, so you can also just come back later.</p>
    <p class="muted">Meanwhile, the <a href="resources/">teacher resources</a> (slides, classwork and lesson plans) are open to everyone.</p>
    <button class="btn" id="so">Sign out</button></section>`;
}
// ---------- admin: approve teachers, set the answer key secret ----------
let stopTeachers=null;
function adminPanel(){
  const box=$('#adminview'); if(!box) return;
  box.innerHTML=`<div class="toolbar"><h2>Admin · Teacher access</h2></div>
    <p class="muted" style="margin:0 0 8px">Teachers who sign in ask for access here. Approve real teachers; reject anyone else. Only approved teachers can create classes and read the answer key.</p>
    <div id="teacherList"><p class="muted">Loading…</p></div>
    <h3 style="margin:18px 0 6px">Answer key secret</h3>
    <p class="muted" style="margin:0 0 8px">The answer key on this page is encrypted. Approved teachers unlock it with this secret. <span id="secretState"></span></p>
    <form class="row" id="secretForm" style="gap:8px;flex-wrap:wrap"><input class="field" id="secretIn" style="max-width:420px" placeholder="Paste the secret" autocomplete="off"><button class="btn" id="secretGo">Save secret</button><span id="secretMsg" class="muted"></span></form>`;
  Cloud.getConfig('answerKey').then(c=>{ $('#secretState').textContent=c&&c.secret?'A secret is saved.':'No secret saved yet, so the answer key cannot be opened.' }).catch(()=>{});
  $('#secretForm').addEventListener('submit',async e=>{ e.preventDefault(); const v=$('#secretIn').value.trim(); if(!v) return;
    try{ await Cloud.setConfig('answerKey',{secret:v}); keyData=null; $('#secretMsg').textContent='Saved.'; $('#secretState').textContent='A secret is saved.'; $('#secretIn').value='' }catch(err){ console.error(err); $('#secretMsg').textContent='Could not save.' } });
  if(stopTeachers) stopTeachers();
  stopTeachers=Cloud.watchTeachers((list,err)=>{
    const el=$('#teacherList'); if(!el) return;
    if(err){ el.innerHTML='<p class="err">Could not load teacher requests. Check that the Firestore rules are published.</p>'; return }
    if(!list.length){ el.innerHTML='<p class="muted">No teacher requests yet.</p>'; return }
    const order={pending:0,approved:1,rejected:2};
    list.sort((a,b)=>(order[a.status]??3)-(order[b.status]??3) || (a.name||'').localeCompare(b.name||''));
    el.innerHTML=`<div class="tablewrap"><table><thead><tr><th class="name">Teacher</th><th>School</th><th>Status</th><th>Asked</th><th></th></tr></thead><tbody>${list.map(t=>`<tr>
      <td class="name"><b>${esc(t.name)}</b><small>${esc(t.email)}</small></td><td>${esc(t.school)}</td>
      <td><span class="tstat ${esc(t.status)}">${t.status==='pending'?'Waiting':t.status==='approved'?'Approved':'Rejected'}</span></td><td>${ago(t.requestedAt)}</td>
      <td style="white-space:nowrap">${t.status!=='approved'?`<button class="btn" data-act="approved" data-uid="${esc(t.uid)}">Approve</button> `:''}${t.status!=='rejected'?`<button class="btn" data-act="rejected" data-uid="${esc(t.uid)}">Reject</button> `:''}<button class="btn" data-act="remove" data-uid="${esc(t.uid)}" title="Delete the request; the teacher can ask again">Remove</button></td></tr>`).join('')}</tbody></table></div>`;
    el.onclick=async e=>{ const b=e.target.closest('button[data-act]'); if(!b) return; b.disabled=true;
      try{ if(b.dataset.act==='remove') await Cloud.removeTeacher(b.dataset.uid); else await Cloud.setTeacherStatus(b.dataset.uid,b.dataset.act) }catch(err){ console.error(err); b.disabled=false; alert('Could not save. Try again.') } };
  });
}
