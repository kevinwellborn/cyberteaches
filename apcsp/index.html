<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AP Computer Science Principles</title>
<meta name="description" content="CyberTeaches AP Computer Science Principles: lessons, vocabulary, and AP-style practice for all five Big Ideas.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
:root{
  --bg:#EEF1EC; --panel:#FFFFFF; --panel-2:#F6F8F4; --ink:#1C292C; --muted:#5C6B6B; --line:#D5DCD4;
  --accent:#0F7B78; --accent-ink:#FFFFFF; --accent-soft:#D6EEEA;
  --good:#2E9363; --good-soft:#DDF1E6; --bad:#C8402F; --bad-soft:#F8E0DB; --term:#13201F; --term-ink:#B9F5DA;
  --u1:#2F6FDE; --u2:#2E9363; --u3:#D97E16; --u4:#C2417A; --u5:#7A4FD0;
  --f-display:"Bricolage Grotesque", "Trebuchet MS", system-ui, sans-serif;
  --f-body:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#141B1C; --panel:#1C2526; --panel-2:#222D2E; --ink:#E6EEEC; --muted:#9AABA9; --line:#33403F;
  --accent:#3FC1B8; --accent-ink:#0B1A1A; --accent-soft:#1D3A38;
  --good:#4CC28A; --good-soft:#1B3328; --bad:#EF6B57; --bad-soft:#3A221E; --term:#0C1213; --term-ink:#9FEBC8; --u1:#5B8FF0; --u2:#45B57E; --u3:#E9A04A; --u4:#E06A9E; --u5:#A083EA; color-scheme:dark }
}
:root[data-theme="dark"]{
  --bg:#141B1C; --panel:#1C2526; --panel-2:#222D2E; --ink:#E6EEEC; --muted:#9AABA9; --line:#33403F;
  --accent:#3FC1B8; --accent-ink:#0B1A1A; --accent-soft:#1D3A38;
  --good:#4CC28A; --good-soft:#1B3328; --bad:#EF6B57; --bad-soft:#3A221E; --term:#0C1213; --term-ink:#9FEBC8; --u1:#5B8FF0; --u2:#45B57E; --u3:#E9A04A; --u4:#E06A9E; --u5:#A083EA; color-scheme:dark
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{margin:0;color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.55;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-bottom:48px}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.15}
.wrap{max-width:1080px;margin:0 auto}
.topbar{display:flex;align-items:center;gap:14px;padding-block:16px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:800;font-size:20px;text-decoration:none;color:var(--ink)}
.brand svg{width:32px;height:32px}
.spacer{flex:1}
.nav a{font-weight:700;text-decoration:none;padding:6px 10px;border-radius:8px;color:var(--ink)}
.nav a:hover,.nav a.on{background:var(--accent-soft)}
.btn{border:2px solid var(--line);background:var(--panel);border-radius:10px;padding:8px 14px;font-weight:700;display:inline-flex;align-items:center;gap:8px;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.small{padding:4px 10px;font-size:14px}
.label{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.muted{color:var(--muted)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:22px}

.hero{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:28px;align-items:center;padding-block:20px 32px}
.hero h1{font-size:clamp(32px,5vw,54px);font-weight:800;letter-spacing:-.02em}
.hero h1 em{font-style:normal;color:var(--accent)}
.hero p{font-size:18px;color:var(--muted);max-width:54ch;margin:14px 0 20px}
.terminal{background:var(--term);color:var(--term-ink);border-radius:14px;padding:18px 20px;font-family:var(--f-mono);font-size:14px;line-height:1.7;overflow:hidden;min-width:0}
.terminal .dim{opacity:.6}
.meter{display:flex;flex-direction:column;gap:6px;max-width:360px}
.meter-bar{height:10px;border-radius:99px;background:var(--line);overflow:hidden}
.meter-bar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .4s}

.units{display:grid;gap:18px}
.unit{display:grid;grid-template-columns:auto minmax(0,1fr);gap:18px}
.unit-num{font-family:var(--f-display);font-weight:800;width:54px;height:54px;border-radius:14px;display:grid;place-items:center;color:#fff;font-size:20px}
.unit h2{font-size:24px}
.unit .blurb{color:var(--muted);margin:4px 0 14px;max-width:72ch}
.topics{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.topic-link{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--panel-2);text-decoration:none;color:var(--ink);font-size:15px;line-height:1.35}
.topic-link:hover{border-color:var(--accent)}
.topic-link b{font-family:var(--f-mono);font-size:13px;color:var(--muted);flex:none;padding-top:1px}
.topic-link .chk{margin-left:auto;flex:none;width:20px;height:20px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:12px}
.topic-link.done .chk{background:var(--u, var(--good));border-color:var(--u, var(--good));color:#fff}
/* Unit color coding: each unit section sets --u and its cards, lessons and quiz pick it up */
.unit{border-top:6px solid var(--u)}
.unit .pill{background:color-mix(in srgb, var(--u) 16%, transparent)}
.unit .topic-link{background:color-mix(in srgb, var(--u) 7%, var(--panel))}
.unit .topic-link:hover{border-color:var(--u)}
.unit .topic-link b{color:var(--u)}
.u-scope .label.u{color:var(--u)}
.u-scope h1{border-bottom:4px solid var(--u);padding-bottom:10px;display:inline-block}
.u-scope .quiz,.u-scope .side .card.unitbox{border-top:6px solid var(--u)}
.u-scope .choice:hover:not(:disabled){border-color:var(--u)}
.u-band{display:inline-flex;align-items:center;gap:8px;font-weight:700;font-size:14px;padding:3px 12px 3px 4px;border-radius:99px;background:color-mix(in srgb, var(--u) 16%, transparent)}
.u-band i{font-style:normal;width:22px;height:22px;border-radius:50%;background:var(--u);color:#fff;display:grid;place-items:center;font-size:12px}
.section-head{display:flex;align-items:end;justify-content:space-between;gap:12px;margin:34px 0 14px;flex-wrap:wrap}
.section-head h2{font-size:28px}
.labs{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
.lab-card{text-decoration:none;color:var(--ink);display:flex;flex-direction:column;gap:6px}
.lab-card:hover{border-color:var(--accent)}
.lab-card h3{font-size:19px}

.crumbs{font-size:14px;color:var(--muted);margin:6px 0 14px}
.crumbs a{text-decoration:none}
.lesson{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:22px;align-items:start}
.lesson h1{font-size:clamp(28px,4vw,40px);margin-bottom:14px}
.lesson .summary{font-size:19px;max-width:68ch}
.topic-art{display:block;width:100%;max-width:680px;height:auto;margin:14px 0 6px}
.terms{display:grid;gap:10px;margin:0;padding:0;list-style:none}
.terms li{border-left:4px solid var(--u, var(--accent));padding:4px 0 4px 12px}
.terms dt,.terms b{font-weight:700}
.side{display:grid;gap:14px;position:sticky;top:12px}
.quiz{margin-top:22px;display:grid;gap:18px}
.q h3{font-family:var(--f-body);font-size:18px;font-weight:700;margin-bottom:10px;line-height:1.4}
.choices{display:grid;gap:8px}
.choice{white-space:pre-line;text-align:left;border:2px solid var(--line);background:var(--panel-2);border-radius:10px;padding:10px 14px}
.choice:hover:not(:disabled){border-color:var(--accent)}
.choice:disabled{cursor:default}
.choice.right{border-color:var(--good);background:var(--good-soft)}
.choice.wrong{border-color:var(--bad);background:var(--bad-soft)}
.why{margin-top:8px;font-size:15px}
.stim{font-family:var(--f-mono);font-size:13.5px;line-height:1.55;background:var(--panel-2);border:1px solid var(--line);border-left:4px solid var(--u, var(--accent));border-radius:10px;padding:12px 14px;margin:0 0 12px;white-space:pre-wrap;word-break:break-word;overflow-x:auto}
.skill{display:inline-block;font-size:12px;font-weight:700;letter-spacing:.04em;color:var(--muted);margin-bottom:6px}
.choice .letter{font-family:var(--f-mono);font-size:14px;margin-right:4px}
.pager{display:flex;justify-content:space-between;gap:12px;margin-top:26px;flex-wrap:wrap}
.pill{display:inline-block;font-size:13px;font-weight:700;padding:2px 10px;border-radius:99px;background:var(--accent-soft);color:var(--ink)}

/* labs */
.lab h1{font-size:clamp(28px,4vw,40px)}
.lab .intro{color:var(--muted);max-width:68ch;margin:8px 0 18px}
.msg{border:1px solid var(--line);border-radius:12px;background:var(--panel-2);padding:14px 16px;font-size:15px}
.msg .from{font-family:var(--f-mono);font-size:13px;color:var(--muted)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.result{margin-top:10px;padding:10px 14px;border-radius:10px;font-size:15px}
.result.ok{background:var(--good-soft)}
.result.no{background:var(--bad-soft)}
.mono{font-family:var(--f-mono)}
.url{font-family:var(--f-mono);font-size:16px;word-break:break-all;padding:10px 14px;border-radius:10px;background:var(--term);color:var(--term-ink)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:6px 10px;border-bottom:1px solid var(--line)}
th{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.scroll{overflow-x:auto}
.rule{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--panel-2);font-family:var(--f-mono);font-size:14px}
.tag{font-weight:700;padding:1px 8px;border-radius:6px;font-family:var(--f-body);font-size:13px}
.tag.allow{background:var(--good-soft);color:var(--good)}
.tag.deny{background:var(--bad-soft);color:var(--bad)}
input[type=text],input[type=password]{width:100%;padding:10px 12px;border:2px solid var(--line);border-radius:10px;background:var(--panel)}
input[type=range]{width:100%;accent-color:var(--accent)}
.strength{height:12px;border-radius:99px;background:var(--line);overflow:hidden}
.strength i{display:block;height:100%;transition:width .3s,background .3s}
.brute{font-family:var(--f-mono);font-size:14px;display:grid;gap:2px;max-height:320px;overflow:auto;background:var(--term);color:var(--term-ink);padding:12px;border-radius:12px}
.book{display:grid;grid-template-columns:auto minmax(0,1fr);gap:22px;align-items:center;margin-top:28px;background:var(--accent-soft);border-color:transparent}
.book img{width:120px;height:auto;border-radius:8px;box-shadow:0 6px 18px rgba(0,0,0,.18)}
.book .cover{width:120px;aspect-ratio:2/3;border-radius:8px;object-fit:cover;box-shadow:0 6px 18px rgba(0,0,0,.18)}
.book .cover{background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;text-align:center;padding:10px;font-family:var(--f-display);font-weight:800;font-size:15px;line-height:1.2}
.book h2{font-size:26px}
.book.big img,.book.big .cover{width:200px}
.deeper{display:flex;gap:14px;align-items:flex-start}
.deeper img{width:72px;height:auto;border-radius:6px;box-shadow:0 4px 12px rgba(0,0,0,.18);display:block}
.video{position:relative;aspect-ratio:16/9;border-radius:14px;overflow:hidden;background:var(--term);margin:20px 0 0}
.video iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.term-box{background:var(--term);color:var(--term-ink);border-radius:14px;font-family:var(--f-mono);font-size:14px;line-height:1.55;display:flex;flex-direction:column;min-width:0;height:520px;cursor:text}
.term-out{flex:1;overflow:auto;padding:16px 16px 4px;white-space:pre-wrap;word-break:break-word}
.term-out .cmd{opacity:.65;margin-top:8px}
.term-out .win{color:#FFE08A}
.term-in{display:flex;gap:8px;align-items:center;padding:10px 16px 14px;border-top:1px solid rgba(255,255,255,.08)}
.term-in label{flex:none;opacity:.8}
.term-in input{flex:1;min-width:0;background:transparent;border:0;color:inherit;font-size:14px;outline:none;padding:4px 0}
.term-box:focus-within{box-shadow:0 0 0 3px var(--accent)}
.steps{margin:0;padding:0;list-style:none;display:grid;gap:6px;font-size:15px}
.steps li.ok{color:var(--good);font-weight:700}
@media (max-width:820px){ .term-box{height:440px} .term-in label{display:none} }
.foot{margin-top:40px;color:var(--muted);font-size:14px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
@media (max-width:820px){ .hero,.lesson{grid-template-columns:1fr} .side{position:static} .unit{grid-template-columns:1fr} }
.lesson>*{min-width:0}
.lesson h1{overflow-wrap:break-word}
.yt-banner{position:relative;display:block;text-decoration:none;margin:12px 0 4px;border-radius:14px;overflow:hidden;box-shadow:0 4px 14px rgba(0,0,0,.12)}
.yt-banner img{display:block;width:100%;height:auto}
.yt-banner .yt-cta{position:absolute;right:12px;bottom:10px;display:inline-flex;align-items:center;gap:6px;background:#E02F2F;color:#fff;font-weight:700;font-size:14px;padding:6px 12px;border-radius:99px;text-decoration:none;box-shadow:0 2px 8px rgba(0,0,0,.25)}
.yt-banner:hover .yt-cta,.yt-banner:focus-visible .yt-cta{background:#C21F1F}
@media (max-width:560px){ .yt-banner .yt-cta{position:static;display:flex;justify-content:center;border-radius:0;box-shadow:none;font-size:13px;padding:7px} }
</style>
</head><body>
<div class="wrap">
  <a class="yt-banner" href="https://www.youtube.com/@cyberteaches?sub_confirmation=1" target="_blank" rel="noopener" aria-label="Subscribe to CyberTeaches on YouTube">
    <img src="../yt-banner.jpg" alt="CyberTeaches: cybersecurity made easy, fun and short lessons. Kevin Wellborn's AP CSP, AP Cybersecurity, and Security+ study guides." width="1328" height="288">
    <span class="yt-cta"><svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><path d="M6 4l14 8-14 8z" fill="#fff"/></svg>Subscribe on YouTube</span>
  </a>
  <header class="topbar">
    <a class="brand" href="#/">
      <svg viewBox="0 0 32 32" aria-hidden="true"><rect x="2" y="4" width="28" height="24" rx="6" fill="var(--accent)"/><path d="M11 11l-5 5 5 5M21 11l5 5-5 5M18 9l-4 14" fill="none" stroke="var(--accent-ink)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      AP CSP
    </a>
    <span class="spacer"></span>
    <nav class="nav" aria-label="Main">
      <a href="#/" data-nav="home">Big Ideas</a>
      <a href="#/labs" data-nav="labs">Labs</a>
      <a href="#/book" data-nav="book" id="bookNav" hidden>The Book</a>
      <a href="#" id="videoNav" target="_blank" rel="noopener" hidden>Videos</a>
      <a href="../">All courses</a>
    </nav>
  </header>
  <main id="app"></main>
  <div class="foot"><span>Progress is saved in this browser.</span><span>Big Ideas and topics follow the College Board AP Computer Science Principles course framework.</span></div>
</div>
<script src="content.js"></script>
<script src="questions.js"></script>
<script src="labs.js"></script>
<script src="figures.js"></script>
<script src="images.js"></script>
<script>
(function(){
  const app = document.getElementById('app');
  const UNITS = window.AP_UNITS, LABS = window.AP_LABS, BOOK = window.AP_BOOK || {};
  const hasBook = !!BOOK.title;
  if (hasBook) document.getElementById('bookNav').hidden = false;
  const VIDEOS = window.AP_VIDEOS || {};
  if (VIDEOS.channelUrl) { const v = document.getElementById('videoNav'); v.href = VIDEOS.channelUrl; v.hidden = false; }
  // Accepts a bare id or any common YouTube link form (watch?v=, youtu.be/, embed/, shorts/).
  const ytId = s => { const m = String(s || '').match(/(?:v=|youtu\.be\/|embed\/|shorts\/)([\w-]{11})/); return m ? m[1] : /^[\w-]{11}$/.test(s) ? s : ''; };
  const ALL = UNITS.flatMap(u => u.topics.map(t => Object.assign({ unit: u }, t)));
  const labsOf = t => t.labs || (t.lab ? [t.lab] : []);
  const MISSIONS = window.AP_MISSIONS || [];
  const KEY = 'ctcsp-progress-v1';
  let progress = {};
  try { progress = JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) {}
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(progress)); } catch (e) {} };
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
  const isDone = id => progress[id] && progress[id].passed;
  const doneCount = () => ALL.filter(t => isDone(t.id)).length;

  function route(){
    const parts = (location.hash.replace(/^#\/?/, '') || '').split('/');
    document.querySelectorAll('[data-nav]').forEach(a => a.classList.toggle('on', a.dataset.nav === (parts[0] === 'labs' || parts[0] === 'lab' ? 'labs' : parts[0] === 'book' ? 'book' : parts[0] ? '' : 'home')));
    if (parts[0] === 'book' && hasBook) renderBook(); else
    if (parts[0] === 'topic' && ALL.find(t => t.id === parts[1])) renderTopic(parts[1]);
    else if (parts[0] === 'labs') renderLabs();
    else if (parts[0] === 'lab' && LABS[parts[1]]) renderLab(parts[1]);
    else renderHome();
    window.scrollTo(0, 0);
  }
  window.addEventListener('hashchange', route);

  function topicLinks(u){
    return u.topics.map(t => `<a class="topic-link${isDone(t.id) ? ' done' : ''}" href="#/topic/${t.id}"><b>${t.id}</b><span>${esc(t.title)}</span><span class="chk" aria-label="${isDone(t.id) ? 'Completed' : 'Not completed'}">${isDone(t.id) ? '✓' : ''}</span></a>`).join('');
  }

  function cover(){
    return BOOK.cover ? `<img src="${esc(BOOK.cover)}" alt="Cover of ${esc(BOOK.title)}">` : `<div class="cover" aria-hidden="true">${esc(BOOK.title)}</div>`;
  }
  function buyBtn(){
    return BOOK.buyUrl ? `<a class="btn primary" href="${esc(BOOK.buyUrl)}" target="_blank" rel="noopener">Get the book</a>` : '';
  }
  function bookCard(big){
    if (!hasBook) return '';
    return `<section class="card book${big ? ' big' : ''}">${cover()}<div>
      <span class="label">The companion book</span>
      <h2 style="margin:6px 0 4px">${esc(BOOK.title)}</h2>
      ${BOOK.author ? `<div class="muted" style="margin-bottom:8px">by ${esc(BOOK.author)}</div>` : ''}
      ${BOOK.tagline ? `<p style="margin:0 0 14px;max-width:62ch">${esc(BOOK.tagline)}</p>` : ''}
      <div class="row">${buyBtn()}${big ? '' : '<a class="btn" href="#/book">About the book</a>'}</div>
    </div></section>`;
  }
  function renderBook(){
    const ch = UNITS.flatMap(u => u.topics.filter(t => BOOK.chapters && BOOK.chapters[t.id]).map(t => `<li><a href="#/topic/${t.id}">${t.id} ${esc(t.title)}</a>: ${esc(BOOK.chapters[t.id])}</li>`));
    app.innerHTML = bookCard(true) + (BOOK.description ? `<section class="card" style="margin-top:18px"><h2 style="font-size:22px;margin-bottom:8px">About the book</h2><p style="margin:0;max-width:70ch;white-space:pre-line">${esc(BOOK.description)}</p></section>` : '')
      + (ch.length ? `<section class="card" style="margin-top:18px"><h2 style="font-size:22px;margin-bottom:8px">Where each topic is in the book</h2><ul style="margin:0">${ch.join('')}</ul></section>` : '');
  }

  function renderHome(){
    const d = doneCount(), next = ALL.find(t => !isDone(t.id)) || ALL[0];
    app.innerHTML = `
      <section class="hero">
        <div>
          <span class="label">CyberTeaches · AP Computer Science Principles</span>
          <h1 style="margin-top:8px">Learn how computing <em>really works.</em></h1>
          <p>Five Big Ideas and ${ALL.length} topics. Read each topic and its vocabulary, then pass its AP-style practice to mark it complete.</p>
          <div class="row" style="margin-bottom:18px">
            <a class="btn primary" href="#/topic/${next.id}">${d ? 'Continue' : 'Start'} with ${next.id} ${esc(next.title)}</a>
            <a class="btn" href="#/labs">Try a lab</a>
          </div>
          <div class="meter"><span class="label">${d} of ${ALL.length} topics complete</span><div class="meter-bar"><i style="width:${Math.round(d / ALL.length * 100)}%"></i></div></div>
        </div>
        <div class="terminal" aria-hidden="true">

        bar.style.background = pct < 35 ? 'var(--bad)' : pct < 65 ? '#D97E16' : 'var(--good)';
        el.querySelector('#out').innerHTML = !p ? 'Start typing.' :
          `<b style="color:var(--ink)">Estimated crack time: ${fmt(secs)}</b><br>Length ${p.length}, character pool ${pool}${weak ? '<br>Contains a common word or pattern, so a dictionary attack would find it almost instantly. Symbol swaps like @ for a do not help much.' : ''}<br>Tip: length beats complexity. Four random words make a strong, memorable passphrase. Use a password manager and MFA.`;
      });
    },
    caesar(){
      const el = labShell('caesar', 'The Caesar cipher shifts every letter by the same amount (the key). Try encrypting a message, then crack the secret one below by trying every key.');
      const shift = (s, k) => s.replace(/[a-z]/gi, ch => { const b = ch <= 'Z' ? 65 : 97; return String.fromCharCode((ch.charCodeAt(0) - b + k + 26) % 26 + b); });
      const secret = shift('DEFENSE IN DEPTH BEATS ANY SINGLE LOCK', 11);
      el.innerHTML = `<div class="lesson" style="grid-template-columns:minmax(0,1fr) minmax(0,1fr)">
        <div class="card" style="display:grid;gap:12px"><h2 style="font-size:20px">Encrypt and decrypt</h2>
          <label for="msg"><b>Plaintext</b></label><input id="msg" type="text" value="Meet at the library at noon">
          <label for="key"><b>Key: <span id="kv">3</span></b></label><input id="key" type="range" min="1" max="25" value="3">
          <span class="label">Ciphertext</span><div class="url" id="ct"></div>
        </div>
        <div class="card" style="display:grid;gap:12px"><h2 style="font-size:20px">Crack the secret</h2>
          <div class="url">${secret}</div>
          <p class="muted" style="margin:0">Brute force: here is the message decrypted with every possible key. Which one is English?</p>
          <div class="brute">${Array.from({ length: 25 }, (_, i) => `<div><span style="opacity:.6">key ${String(i + 1).padStart(2, ' ')}:</span> ${shift(secret, -(i + 1))}</div>`).join('')}</div>
          <p class="muted" style="margin:0;font-size:15px">Only 25 keys means a computer cracks it instantly. AES-256 has about 10<sup>77</sup> possible keys.</p>
        </div></div>`;
      const upd = () => { const k = +el.querySelector('#key').value; el.querySelector('#kv').textContent = k; el.querySelector('#ct').textContent = shift(el.querySelector('#msg').value, k); };
      el.querySelector('#msg').addEventListener('input', upd); el.querySelector('#key').addEventListener('input', upd); upd();
    }
  };
  // Pretend terminal shared by every mission in missions.js.
  function runMission(m){
    const el = labShell(m.key, `${m.intro} Type <b class="mono">help</b> to see the commands. Nothing here is real, so you cannot break anything.`);
    const FILES = m.files, home = m.home, prompt = `${m.user}@lincoln`;
    const DIRS = {};
    Object.keys(FILES).forEach(f => {
      const parts = f.split('/').filter(Boolean);
      for (let i = 0; i < parts.length; i++) {
        const dir = '/' + parts.slice(0, i).join('/');
        DIRS[dir] = DIRS[dir] || [];
        if (!DIRS[dir].includes(parts[i])) DIRS[dir].push(parts[i]);
      }
    });
    const done = new Set();
    let cwd = home, hist = [], hi = 0;
    el.innerHTML = `<div class="lesson" style="grid-template-columns:minmax(0,1fr) 300px;--u:var(--u${m.unit})">
      <div class="term-box"><div class="term-out" id="out" aria-live="polite"></div>
        <form class="term-in" id="form"><label for="cmd" class="mono">${prompt}:<span id="cwd">~</span>$</label><input id="cmd" class="mono" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Command"></form></div>
      <aside class="card" style="display:grid;gap:10px;border-top:6px solid var(--u)"><span class="label">Mission · Unit ${m.unit}</span><h3 style="font-size:19px">${esc(m.title)}</h3><ol id="steps" class="steps"></ol>
        <button class="btn small" id="hint" type="button">Show a hint</button><div id="hintText" class="muted" style="font-size:15px"></div>
        <div id="flag" class="result ok" hidden></div></aside></div>`;
    const out = el.querySelector('#out'), input = el.querySelector('#cmd');
    const print = (s, cls) => { const d = document.createElement('div'); if (cls) d.className = cls; d.textContent = s; out.appendChild(d); out.scrollTop = out.scrollHeight; };
    const drawSteps = () => { el.querySelector('#steps').innerHTML = m.steps.map(s => `<li class="${done.has(s.k) ? 'ok' : ''}">${done.has(s.k) ? '✓' : '○'} ${esc(s.t)}</li>`).join(''); };
    const mark = k => { if (!done.has(k)) { done.add(k); drawSteps(); } };
    const resolve = p => {
      if (!p || p === '~') return home;
      if (p.startsWith('~/')) p = home + '/' + p.slice(2);
      const parts = p.startsWith('/') ? [] : cwd.split('/').filter(Boolean);
      p.split('/').filter(Boolean).forEach(x => { if (x === '..') parts.pop(); else if (x !== '.') parts.push(x); });
      return '/' + parts.join('/');
    };
    const readFile = p => { const f = resolve(p); if (FILES[f] == null) return null; if (m.reads && m.reads[f]) mark(m.reads[f]); return FILES[f]; };
    const api = { mark, resolve, readFile };
    const base = {
      help: () => ['Commands:', '  ls [folder]        list files', '  cd <folder>        change folder', '  cat <file>         show a file', '  grep <word> <file> find lines containing a word (a folder searches every file in it)', '  pwd                show current folder', ...(m.help || []).map(h => '  ' + h), '  report <answer>    submit your answer', '  hint               get a hint', '  clear              clear the screen', 'You can also pipe into grep:  cat <file> | grep <word>'].join('\n'),
      whoami: () => m.user,
      pwd: () => cwd,
      ls: a => { const d = resolve(a[0]); if (m.onLs) m.onLs(d, api); return DIRS[d] ? DIRS[d].join('  ') : FILES[d] != null ? d.split('/').pop() : `ls: ${a[0]}: No such file or folder`; },
      cd: a => { const d = resolve(a[0]); if (!DIRS[d]) return `cd: ${a[0]}: No such folder`; cwd = d; el.querySelector('#cwd').textContent = d.startsWith(home) ? '~' + d.slice(home.length) : d; return ''; },
      cat: a => { if (!a[0]) return 'cat: which file? Example: cat mission.txt'; const f = readFile(a[0]); return f == null ? (DIRS[resolve(a[0])] ? `cat: ${a[0]} is a folder. Try: ls ${a[0]}` : `cat: ${a[0]}: No such file`) : f; },
      grep: (a, piped) => {
        const w = a[0]; if (!w) return 'grep: which word? Example: grep FAILED /var/log/auth.log';
        const target = piped != null ? '' : resolve(a[1] || '');
        if (m.onGrep) m.onGrep(w, target, api);
        const match = t => t.split('\n').filter(l => l.toLowerCase().includes(w.toLowerCase()));
        if (piped != null) return match(piped).join('\n') || '(no matching lines)';
        if (DIRS[target]) {
          const lines = Object.keys(FILES).filter(f => f.startsWith(target + '/')).flatMap(f => { const r = FILES[f]; return match(r).map(l => `${f.slice(target.length + 1)}: ${l}`); });
          return lines.join('\n') || '(no matching lines)';
        }
        const text = readFile(a[1] || '');
        if (text == null) return `grep: ${a[1] || '(no file)'}: No such file`;
        return match(text).join('\n') || '(no matching lines)';
      },
      hint: () => { const s = m.steps.find(s => !done.has(s.k)); return s ? 'Hint: ' + s.hint : 'You finished the mission!'; },
      clear: () => { out.innerHTML = ''; return ''; },
      report: a => {
        if (!a[0]) return 'report: what is your answer? ' + (m.steps.find(s => s.k === 'report') || {}).hint;
        const r = m.report(a.join(' '), api);
        if (r.ok) {
          mark('report');
          const f = r.text.match(/CTF\{[^}]+\}/);
          if (f) { const box = el.querySelector('#flag'); box.hidden = false; box.innerHTML = `<b>Mission complete.</b><br>Flag: <span class="mono">${esc(f[0])}</span>`; }
        }
        return r.text;
      }
    };
    const extra = m.commands ? m.commands(api) : {};
    const cmds = Object.assign({}, base);
    Object.entries(extra).forEach(([k, f]) => { if (f) cmds[k] = f; });
    function run(line){
      print(`${prompt}:${el.querySelector('#cwd').textContent}$ ${line}`, 'cmd');
      const segs = line.split('|').map(s => s.trim()).filter(Boolean);
      let result = null, win = false;
      for (let i = 0; i < segs.length; i++) {
        const [c, ...args] = segs[i].split(/\s+/);
        const f = cmds[c.toLowerCase()];
        if (!f) { result = `${c}: command not found. Type help to see commands.`; break; }
        if (i > 0 && c !== 'grep') { result = 'Only grep can be used after |'; break; }
        const before = done.has('report');
        result = f(args, i > 0 ? result : null);
        win = !before && done.has('report');
      }
      if (result) print(result, win ? 'win' : '');
    }
    el.querySelector('#form').addEventListener('submit', e => {
      e.preventDefault(); const v = input.value.trim(); input.value = '';
      if (!v) return; hist.push(v); hi = hist.length; run(v);
    });
    input.addEventListener('keydown', e => {
      if (e.key === 'ArrowUp' && hi > 0) { input.value = hist[--hi]; e.preventDefault(); }
      if (e.key === 'ArrowDown') { hi = Math.min(hist.length, hi + 1); input.value = hist[hi] || ''; e.preventDefault(); }
    });
    el.querySelector('#hint').addEventListener('click', () => { el.querySelector('#hintText').textContent = cmds.hint(); });
    el.querySelector('.term-box').addEventListener('click', () => input.focus());
    print('Lincoln High School console. Type help to begin, or cat mission.txt to read your mission.');
    drawSteps();
  }

  MISSIONS.forEach(m => { labs[m.key] = () => runMission(m); });
  function renderLab(k){
    const run = window.AP_LAB_RUN && window.AP_LAB_RUN[k];
    if (run) run(labShell(k, LABS[k].intro), esc); else labs[k]();
  }

  route();
})();
</script>
</body></html>
