<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>AP CSA Practice Exam Booklet | CyberTeaches</title>
<meta name="description" content="Printable AP Computer Science A practice exam booklet: answer sheet, Java quick reference, 42 multiple-choice questions, and 4 free-response questions.">
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="../../favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&family=JetBrains+Mono:wght@400;600&display=swap">
<link rel="stylesheet" href="exam.css?v=1">
<style>
.sheet{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:4px 14px;font-family:var(--f-mono);font-size:14px}
.bq{break-inside:avoid;margin:14px 0}
.bq .opts{gap:4px}
.blank{border:1px solid var(--line);border-radius:10px;min-height:340px;margin:10px 0;background:var(--panel)}
@media print{ .noprint{display:none!important} .blank{min-height:520px} }
</style>
<script async src="/analytics.js?v=1"></script>
</head><body>
<div class="wrap">
<header class="topbar noprint">
  <a class="brand" href="../"><img class="logo" src="../../logo.png" alt="" width="36" height="36">AP CSA</a>
  <span class="spacer"></span>
  <nav class="nav" aria-label="Main"><a href="../#/">Units</a><a href="./">Practice exams</a><a href="../../">All courses</a></nav>
</header>
<main id="book"><p>Loading…</p></main>
<footer class="site">AP is a trademark registered by the College Board, which is not affiliated with, and does not endorse, this site. All questions and programs are original CyberTeaches material.</footer>
</div>
<script src="common.js?v=1"></script>
<script>
(function(){
  var p = new URLSearchParams(location.search), n = p.get('n') === '2' ? 2 : 1, key = p.get('key') === '1';
  var s = document.createElement('script'); s.src = 'exam' + n + '.js?v=1'; s.onload = render; document.body.appendChild(s);
  function render(){
    var E = window.CSA_EXAM, X = window.CSA, esc = X.esc, L = 'ABCD';
    document.title = E.name + ' Booklet' + (key ? ' with Answer Key' : '') + ' | CyberTeaches';
    var opt = function(o){ return X.looksCode(o) ? '<code>' + esc(o) + '</code>' : esc(o); };
    var h = '<div class="row noprint"><button class="btn primary" onclick="window.print()">Print</button><a class="btn" href="' + n + '/">Take it online instead</a>' + (key ? '<a class="btn" href="?n=' + n + '">Hide answer key</a>' : '<a class="btn" href="?n=' + n + '&key=1">Add answer key</a>') + '</div>';
    h += '<div class="eyebrow">CyberTeaches</div><h1>' + esc(E.name) + '</h1><p class="lead">Section I: 42 multiple-choice questions, 90 minutes (55%). Section II: 4 free-response questions, 90 minutes (45%).</p>';
    h += '<p>Name: ______________________________ &nbsp; Date: ______________</p>';
    h += '<h2>Answer sheet</h2><div class="sheet">' + E.questions.map(function(q){ return q.id + '. &nbsp;A &nbsp;B &nbsp;C &nbsp;D'; }).map(function(t){ return '<div>' + t + '</div>'; }).join('') + '</div>';
    h += '<h2 id="reference" class="pb">Java quick reference</h2>' + X.REF;
    h += '<h2 class="pb">Section I: Multiple choice</h2><p>Choose the best answer for each question.</p>';
    E.questions.forEach(function(q){
      h += '<div class="bq"><div class="qnum">' + q.id + '.</div><p>' + q.stem + '</p>' + (q.code ? X.code(q.code) : '') + (q.stemAfter ? '<p>' + q.stemAfter + '</p>' : '') +
        '<div>' + q.opts.map(function(o, i){ return '<div>(' + L[i] + ') ' + opt(o) + '</div>'; }).join('') + '</div></div>';
    });
    h += '<h2 class="pb">Section II: Free response</h2><p>Write your answers in Java. Use the method headers exactly as given.</p>';
    E.frq.forEach(function(f){
      var max = f.parts.reduce(function(m, pt){ return m + pt.pts.length; }, 0);
      h += '<div class="pb"><h3>' + f.q + ': ' + esc(f.label) + ' (' + max + ' points)</h3>' + f.intro + (f.code ? X.code(f.code) : '');
      f.parts.forEach(function(pt){ h += (pt.label ? '<h4>Part ' + pt.label + '</h4>' : '') + '<p>' + pt.prompt + '</p><div class="blank"></div>'; });
      h += '</div>';
    });
    if (key) {
      h += '<h2 class="pb">Answer key</h2><div class="tablewrap"><table><tr><th>#</th><th>Answer</th><th>Topic</th><th>Explanation</th></tr>' +
        E.questions.map(function(q){ return '<tr><td>' + q.id + '</td><td><b>' + q.ans + '</b></td><td>' + q.topic + '</td><td>' + esc(q.expl) + '</td></tr>'; }).join('') + '</table></div>';
      h += '<h2 class="pb">Free-response scoring guidelines</h2>';
      E.frq.forEach(function(f){
        h += '<h3>' + f.q + ': ' + esc(f.label) + '</h3>';
        f.parts.forEach(function(pt){ h += (pt.label ? '<h4>Part ' + pt.label + '</h4>' : '') + '<ul>' + pt.pts.map(function(x){ return '<li>1 point: ' + esc(x) + '</li>'; }).join('') + '</ul><p><b>Sample solution</b></p>' + X.code(pt.sample); });
      });
    }
    document.getElementById('book').innerHTML = h;
    if (location.hash) { var t = document.querySelector(location.hash); if (t) t.scrollIntoView(); }
  }
})();
</script>
</body></html>
