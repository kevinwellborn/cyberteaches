<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>App Builder class progress for teachers | CyberTeaches</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="../favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
:root{
  --bg:#EEF1EC; --panel:#FFFFFF; --panel-2:#F6F8F4; --ink:#1C292C; --muted:#5C6B6B; --line:#D5DCD4;
  --accent:#0F7B78; --accent-ink:#FFFFFF; --accent-soft:#D6EEEA;
  --good:#2E9363; --good-soft:#DDF1E6; --bad:#C8402F; --bad-soft:#F8E0DB; --term:#13201F; --term-ink:#B9F5DA;
  --u1:#2F6FDE; --u2:#2E9363; --u3:#D97E16; --u4:#C2417A; --u5:#7A4FD0;
  --f-display:"Bricolage Grotesque", "Trebuchet MS", system-ui, sans-serif;
  --f-body:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#141B1C; --panel:#1C2526; --panel-2:#222D2E; --ink:#E6EEEC; --muted:#9AABA9; --line:#33403F;
  --accent:#3FC1B8; --accent-ink:#0B1A1A; --accent-soft:#1D3A38;
  --good:#4CC28A; --good-soft:#1B3328; --bad:#EF6B57; --bad-soft:#3A221E; --term:#0C1213; --term-ink:#9FEBC8; --u1:#5B8FF0; --u2:#45B57E; --u3:#E9A04A; --u4:#E06A9E; --u5:#A083EA; color-scheme:dark }
}
:root[data-theme="dark"]{
  --bg:#141B1C; --panel:#1C2526; --panel-2:#222D2E; --ink:#E6EEEC; --muted:#9AABA9; --line:#33403F;
  --accent:#3FC1B8; --accent-ink:#0B1A1A; --accent-soft:#1D3A38;
  --good:#4CC28A; --good-soft:#1B3328; --bad:#EF6B57; --bad-soft:#3A221E; --term:#0C1213; --term-ink:#9FEBC8; --u1:#5B8FF0; --u2:#45B57E; --u3:#E9A04A; --u4:#E06A9E; --u5:#A083EA; color-scheme:dark
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{margin:0;color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.55;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-bottom:48px}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.15}
.wrap{max-width:1080px;margin:0 auto}
.topbar{display:flex;align-items:center;gap:14px;padding-block:16px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:800;font-size:20px;text-decoration:none;color:var(--ink)}
.brand svg{width:32px;height:32px}
.brand .logo{width:36px;height:36px;flex:none;border-radius:9px;background:#fff;padding:2px;box-shadow:0 0 0 1px var(--line)}
.spacer{flex:1}
.nav a{font-weight:700;text-decoration:none;padding:6px 10px;border-radius:8px;color:var(--ink)}
.nav a:hover,.nav a.on{background:var(--accent-soft)}
.btn{border:2px solid var(--line);background:var(--panel);border-radius:10px;padding:8px 14px;font-weight:700;display:inline-flex;align-items:center;gap:8px;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.small{padding:4px 10px;font-size:14px}
.label{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.muted{color:var(--muted)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:22px}

.hero{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:28px;align-items:center;padding-block:20px 32px}
.hero h1{font-size:clamp(32px,5vw,54px);font-weight:800;letter-spacing:-.02em}
.hero h1 em{font-style:normal;color:var(--accent)}
.hero p{font-size:18px;color:var(--muted);max-width:54ch;margin:14px 0 20px}
.terminal{background:var(--term);color:var(--term-ink);border-radius:14px;padding:18px 20px;font-family:var(--f-mono);font-size:14px;line-height:1.7;overflow:hidden;min-width:0}
.terminal .dim{opacity:.6}
.meter{display:flex;flex-direction:column;gap:6px;max-width:360px}
.meter-bar{height:10px;border-radius:99px;background:var(--line);overflow:hidden}
.meter-bar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .4s}

.units{display:grid;gap:18px}
.unit{display:grid;grid-template-columns:auto minmax(0,1fr);gap:18px}
.unit-num{font-family:var(--f-display);font-weight:800;width:54px;height:54px;border-radius:14px;display:grid;place-items:center;color:#fff;font-size:20px}
.unit h2{font-size:24px}
.unit .blurb{color:var(--muted);margin:4px 0 14px;max-width:72ch}
.topics{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.topic-link{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--panel-2);text-decoration:none;color:var(--ink);font-size:15px;line-height:1.35}
.topic-link:hover{border-color:var(--accent)}
.topic-link b{font-family:var(--f-mono);font-size:13px;color:var(--muted);flex:none;padding-top:1px}
.topic-link .chk{margin-left:auto;flex:none;width:20px;height:20px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:12px}
.topic-link.done .chk{background:var(--u, var(--good));border-color:var(--u, var(--good));color:#fff}
/* Unit color coding: each unit section sets --u and its cards, lessons and quiz pick it up */
.unit{border-top:6px solid var(--u)}
.unit .pill{background:color-mix(in srgb, var(--u) 16%, transparent)}
.unit .topic-link{background:color-mix(in srgb, var(--u) 7%, var(--panel))}
.unit .topic-link:hover{border-color:var(--u)}
.unit .topic-link b{color:var(--u)}
.u-scope .label.u{color:var(--u)}
.u-scope h1{border-bottom:4px solid var(--u);padding-bottom:10px;display:inline-block}
.u-scope .quiz,.u-scope .side .card.unitbox{border-top:6px solid var(--u)}
.u-scope .choice:hover:not(:disabled){border-color:var(--u)}
.u-band{display:inline-flex;align-items:center;gap:8px;font-weight:700;font-size:14px;padding:3px 12px 3px 4px;border-radius:99px;background:color-mix(in srgb, var(--u) 16%, transparent)}
.u-band i{font-style:normal;width:22px;height:22px;border-radius:50%;background:var(--u);color:#fff;display:grid;place-items:center;font-size:12px}
.section-head{display:flex;align-items:end;justify-content:space-between;gap:12px;margin:34px 0 14px;flex-wrap:wrap}
.section-head h2{font-size:28px}
.labs{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
.lab-card{text-decoration:none;color:var(--ink);display:flex;flex-direction:column;gap:6px}
.lab-card:hover{border-color:var(--accent)}
.lab-card h3{font-size:19px}

.crumbs{font-size:14px;color:var(--muted);margin:6px 0 14px}
.crumbs a{text-decoration:none}
.lesson{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:22px;align-items:start}
.lesson h1{font-size:clamp(28px,4vw,40px);margin-bottom:14px}
.lesson .summary{font-size:19px;max-width:68ch}
.topic-art{display:block;width:100%;max-width:680px;height:auto;margin:14px 0 6px}
.terms{display:grid;gap:10px;margin:0;padding:0;list-style:none}
.terms li{border-left:4px solid var(--u, var(--accent));padding:4px 0 4px 12px}
.terms dt,.terms b{font-weight:700}
.side{display:grid;gap:14px;position:sticky;top:12px}
.quiz{margin-top:22px;display:grid;gap:18px}
.q h3{font-family:var(--f-body);font-size:18px;font-weight:700;margin-bottom:10px;line-height:1.4}
.choices{display:grid;gap:8px}
.choice{white-space:pre-line;text-align:left;border:2px solid var(--line);background:var(--panel-2);border-radius:10px;padding:10px 14px}
.choice:hover:not(:disabled){border-color:var(--accent)}
.choice:disabled{cursor:default}
.choice.right{border-color:var(--good);background:var(--good-soft)}
.choice.wrong{border-color:var(--bad);background:var(--bad-soft)}
.why{margin-top:8px;font-size:15px}
.stim{font-family:var(--f-mono);font-size:13.5px;line-height:1.55;background:var(--panel-2);border:1px solid var(--line);border-left:4px solid var(--u, var(--accent));border-radius:10px;padding:12px 14px;margin:0 0 12px;white-space:pre-wrap;word-break:break-word;overflow-x:auto}
.skill{display:inline-block;font-size:12px;font-weight:700;letter-spacing:.04em;color:var(--muted);margin-bottom:6px}
.choice .letter{font-family:var(--f-mono);font-size:14px;margin-right:4px}
.pager{display:flex;justify-content:space-between;gap:12px;margin-top:26px;flex-wrap:wrap}
.pill{display:inline-block;font-size:13px;font-weight:700;padding:2px 10px;border-radius:99px;background:var(--accent-soft);color:var(--ink)}

/* labs */
.lab h1{font-size:clamp(28px,4vw,40px)}
.lab .intro{color:var(--muted);max-width:68ch;margin:8px 0 18px}
.msg{border:1px solid var(--line);border-radius:12px;background:var(--panel-2);padding:14px 16px;font-size:15px}
.msg .from{font-family:var(--f-mono);font-size:13px;color:var(--muted)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.result{margin-top:10px;padding:10px 14px;border-radius:10px;font-size:15px}
.result.ok{background:var(--good-soft)}
.result.no{background:var(--bad-soft)}
.mono{font-family:var(--f-mono)}
.url{font-family:var(--f-mono);font-size:16px;word-break:break-all;padding:10px 14px;border-radius:10px;background:var(--term);color:var(--term-ink)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:6px 10px;border-bottom:1px solid var(--line)}
th{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.scroll{overflow-x:auto}
.rule{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--panel-2);font-family:var(--f-mono);font-size:14px}
.tag{font-weight:700;padding:1px 8px;border-radius:6px;font-family:var(--f-body);font-size:13px}
.tag.allow{background:var(--good-soft);color:var(--good)}
.tag.deny{background:var(--bad-soft);color:var(--bad)}
input[type=text],input[type=password]{width:100%;padding:10px 12px;border:2px solid var(--line);border-radius:10px;background:var(--panel)}
input[type=range]{width:100%;accent-color:var(--accent)}
.strength{height:12px;border-radius:99px;background:var(--line);overflow:hidden}
.strength i{display:block;height:100%;transition:width .3s,background .3s}
.brute{font-family:var(--f-mono);font-size:14px;display:grid;gap:2px;max-height:320px;overflow:auto;background:var(--term);color:var(--term-ink);padding:12px;border-radius:12px}
.book{display:grid;grid-template-columns:auto minmax(0,1fr);gap:22px;align-items:center;margin-top:28px;background:var(--accent-soft);border-color:transparent}
.book img{width:120px;height:auto;border-radius:8px;box-shadow:0 6px 18px rgba(0,0,0,.18)}
.book .cover{width:120px;aspect-ratio:2/3;border-radius:8px;object-fit:cover;box-shadow:0 6px 18px rgba(0,0,0,.18)}
.book .cover{background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;text-align:center;padding:10px;font-family:var(--f-display);font-weight:800;font-size:15px;line-height:1.2}
.book h2{font-size:26px}
.book.big img,.book.big .cover{width:200px}
.deeper{display:flex;gap:14px;align-items:flex-start}
.deeper img{width:72px;height:auto;border-radius:6px;box-shadow:0 4px 12px rgba(0,0,0,.18);display:block}
.video{position:relative;aspect-ratio:16/9;border-radius:14px;overflow:hidden;background:var(--term);margin:20px 0 0}
.video iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.term-box{background:var(--term);color:var(--term-ink);border-radius:14px;font-family:var(--f-mono);font-size:14px;line-height:1.55;display:flex;flex-direction:column;min-width:0;height:520px;cursor:text}
.term-out{flex:1;overflow:auto;padding:16px 16px 4px;white-space:pre-wrap;word-break:break-word}
.term-out .cmd{opacity:.65;margin-top:8px}
.term-out .win{color:#FFE08A}
.term-in{display:flex;gap:8px;align-items:center;padding:10px 16px 14px;border-top:1px solid rgba(255,255,255,.08)}
.term-in label{flex:none;opacity:.8}
.term-in input{flex:1;min-width:0;background:transparent;border:0;color:inherit;font-size:14px;outline:none;padding:4px 0}
.term-box:focus-within{box-shadow:0 0 0 3px var(--accent)}
.steps{margin:0;padding:0;list-style:none;display:grid;gap:6px;font-size:15px}
.steps li.ok{color:var(--good);font-weight:700}
@media (max-width:820px){ .term-box{height:440px} .term-in label{display:none} }
.foot{margin-top:40px;color:var(--muted);font-size:14px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
@media (max-width:820px){ .hero,.lesson{grid-template-columns:1fr} .side{position:static} .unit{grid-template-columns:1fr} }
.lesson>*{min-width:0}
.lesson h1{overflow-wrap:break-word}
.yt-banner{position:relative;display:block;text-decoration:none;margin:12px 0 4px;border-radius:14px;overflow:hidden;box-shadow:0 4px 14px rgba(0,0,0,.12)}
.yt-banner img{display:block;width:100%;height:auto}
.yt-banner .yt-cta{position:absolute;right:12px;bottom:10px;display:inline-flex;align-items:center;gap:6px;background:#E02F2F;color:#fff;font-weight:700;font-size:14px;padding:6px 12px;border-radius:99px;text-decoration:none;box-shadow:0 2px 8px rgba(0,0,0,.25)}
.yt-banner:hover .yt-cta,.yt-banner:focus-visible .yt-cta{background:#C21F1F}
@media (max-width:560px){ .yt-banner .yt-cta{position:static;display:flex;justify-content:center;border-radius:0;box-shadow:none;font-size:13px;padding:7px} }

/* App Builder course: civic blue accent, nine module colors, and the self-paced pieces (steps, fill-in boxes, plan). */
:root{ --accent:#2B55B8; --accent-soft:#DDE6F8; --u6:#1F8FA8; --uc:#2B55B8; --star:#D97E16 }
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --accent:#7FA2F5; --accent-ink:#0B1226; --accent-soft:#1F2C4A; --u6:#4FBAD1; --uc:#7FA2F5; --star:#E9A04A } }
:root[data-theme="dark"]{ --accent:#7FA2F5; --accent-ink:#0B1226; --accent-soft:#1F2C4A; --u6:#4FBAD1; --uc:#7FA2F5; --star:#E9A04A }
.entry{display:grid;gap:12px}
.entry h2{font-size:20px}
.entry ol{margin:0;padding:0;list-style:none;display:grid;gap:8px}
.entry li{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;align-items:start;padding:10px 12px;border-radius:12px;background:var(--panel-2);border:1px solid var(--line)}
.entry li b{display:block}
.entry li span{color:var(--muted);font-size:15px}
.entry .n{font-family:var(--f-display);font-weight:800;width:30px;height:30px;border-radius:9px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center}
.notice{background:var(--accent-soft);border-radius:12px;padding:10px 14px;font-size:15px}
.milestone{display:flex;gap:10px;align-items:flex-start;margin:0 0 14px;padding:10px 12px;border-radius:12px;background:color-mix(in srgb, var(--u) 10%, var(--panel));font-size:15px}
.milestone b{flex:none;color:var(--u)}
.topic-link.soon{opacity:.7;cursor:default}
.topic-link.soon:hover{border-color:var(--line)}
.topic-link .tagsoon{margin-left:auto;flex:none;font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.lesson .more{max-width:68ch}
.block{margin-top:20px}
.block h2{font-size:22px;margin-bottom:4px}
.block .sub{margin:0 0 12px;color:var(--muted);font-size:15px}
.todo{margin:0;padding:0;list-style:none;display:grid;gap:8px}
.todo label{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;align-items:start;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--panel-2);cursor:pointer}
.todo input{width:20px;height:20px;margin:3px 0 0;accent-color:var(--u, var(--accent))}
.todo input:checked + span{color:var(--muted);text-decoration:line-through}
.example{font-family:var(--f-mono);font-size:14px;line-height:1.6;background:var(--panel-2);border:1px solid var(--line);border-left:4px solid var(--u, var(--accent));border-radius:10px;padding:12px 14px;margin:0;white-space:pre-wrap;word-break:break-word}
.field{display:grid;gap:6px}
.field + .field{margin-top:14px}
.field label{font-weight:700}
.field .hint{color:var(--muted);font-size:14px}
textarea{width:100%;padding:10px 12px;border:2px solid var(--line);border-radius:10px;background:var(--panel);color:var(--ink);font:inherit;resize:vertical;min-height:46px}
textarea:focus{border-color:var(--accent);outline:none}
.saved{font-size:13px;color:var(--good);min-height:1.2em}
.rules{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:16px}
.rules h2{font-size:20px;margin-bottom:10px}
.rules ul,.plain{margin:0;padding-left:20px;display:grid;gap:8px}
.page-head{margin:12px 0 20px}
.page-head h1{font-size:clamp(28px,4vw,40px);margin-top:8px}
.page-head p{color:var(--muted);max-width:64ch;margin:8px 0 0}
.plan{display:grid;gap:16px}
.plan-row{display:grid;gap:4px;padding:12px 0;border-top:1px solid var(--line)}
.plan-row:first-of-type{border-top:0;padding-top:0}
.plan-row .v{white-space:pre-wrap}
.plan-row .v.empty{color:var(--muted)}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:16px}
.cacnote{border:2px dashed color-mix(in srgb, var(--uc) 55%, var(--line));border-radius:14px;padding:12px 16px;background:color-mix(in srgb, var(--uc) 7%, var(--panel))}
.cacnote .label{color:var(--uc)}
.cacnote p{margin:6px 0 0;font-size:16px;max-width:68ch}
.section-head a{font-weight:700;text-decoration:none}
td{vertical-align:top}
.blocksnote{border-radius:14px;padding:12px 16px;background:var(--good-soft)}
.blocksnote p{margin:6px 0 0;font-size:16px;max-width:68ch}
.try{border-top:6px solid var(--u, var(--accent))}
.try h2{margin-top:6px}
textarea.code{font-family:var(--f-mono);font-size:14px;line-height:1.6;background:var(--term);color:var(--term-ink);border-color:var(--term);border-radius:12px;padding:14px 16px;margin-top:6px;white-space:pre;overflow-x:auto;tab-size:2}
textarea.code:focus{border-color:var(--accent)}
.output{font-family:var(--f-mono);font-size:14px;line-height:1.6;background:var(--panel-2);border:1px solid var(--line);border-radius:12px;padding:12px 16px;margin:6px 0 0;min-height:56px;max-height:320px;overflow:auto;white-space:pre-wrap;word-break:break-word}
.output .err{color:var(--bad);font-weight:700}
.preview{display:block;width:100%;height:220px;margin-top:6px;border:1px solid var(--line);border-radius:12px;background:#fff}
.preview.tall{height:340px}
.challenge{display:flex;gap:10px;align-items:flex-start;margin-top:14px;padding:10px 12px;border-radius:12px;background:color-mix(in srgb, var(--star) 14%, var(--panel));font-size:15px}
.challenge b{flex:none;color:var(--star)}
/* Show code exactly as typed: no joined symbols such as >= drawn as one character. */
textarea.code,.output,.stim,.example,.lesson p,.terms,.choice,.todo{font-variant-ligatures:none;font-feature-settings:"liga" 0,"calt" 0}
.plan-head{font-size:18px;margin:22px 0 4px}
.plan-head:first-child{margin-top:0}
.plan-head + .plan-row{border-top:0}
.field input{width:100%;padding:10px 12px;border:2px solid var(--line);border-radius:10px;background:var(--panel);color:var(--ink)}
.field input:focus{border-color:var(--accent);outline:none}
#slCode,#joinCode{font-family:var(--f-mono);letter-spacing:.12em;text-transform:uppercase;max-width:220px}
/* Teacher page (teacher.html) */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:12px;margin-top:10px}
.stats div{display:grid;gap:2px}
.stats b{font-family:var(--f-display);font-size:30px;line-height:1}
.stats span{font-size:14px}
table.progress{font-size:15px;font-variant-numeric:tabular-nums}
table.progress th,table.progress td{padding:10px 12px;white-space:nowrap}
table.progress tr.on{background:var(--accent-soft)}
.who{border:0;background:none;padding:0;font-weight:700;color:var(--accent);text-decoration:underline;text-align:left}
.cellp{display:inline-block;min-width:44px;text-align:center;padding:2px 8px;border-radius:8px;background:var(--panel-2);border:1px solid var(--line);color:var(--muted)}
.cellp.part{background:color-mix(in srgb, var(--u) 16%, var(--panel));border-color:transparent;color:var(--ink)}
.cellp.full{background:var(--u);border-color:transparent;color:#fff;font-weight:700}
.dmod{border-left:4px solid var(--u);padding-left:12px;margin-top:14px}
.dmod:first-of-type{margin-top:0}
.dmod ul{list-style:none;margin:6px 0 0;padding:0;display:grid;gap:6px;font-size:15px}
.dmod li{display:grid;grid-template-columns:20px minmax(0,1fr) auto;gap:8px;align-items:start}
.dmod .chk{width:20px;height:20px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:12px}
.dmod li.done .chk{background:var(--u);border-color:var(--u);color:#fff}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}
/* Class activities, lesson scores and the gradebook */
.together{border-left:6px solid var(--u, var(--accent))}
.field .count{font-size:14px;color:var(--muted)}
.field .count.ok{color:var(--good);font-weight:700}
.scorebox{display:grid;gap:8px}
.scorebox .big{font-family:var(--f-display);font-size:30px;line-height:1.1}
.scorebox ul{margin:0;padding:0;list-style:none;display:grid;gap:4px;font-size:15px}
.scorebox li{display:flex;justify-content:space-between;gap:10px}
.scorebox li b.ok{color:var(--good)}
.scorebox p{margin:0;font-size:14px}
.lw{margin-top:12px}
.lw-head{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:6px}
.lw-head h3{font-size:19px;margin:0}
.courseswitch{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:0 0 18px;padding-bottom:14px;border-bottom:1px solid var(--line)}
.courseswitch .muted{font-size:14px}
/* Lesson locks on the teacher page */
.locks{display:grid;gap:12px}
.lockmod{display:grid;gap:8px;padding:12px;border:1px solid var(--line);border-radius:16px;background:var(--panel)}
.locklessons{display:grid;gap:8px;grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}
.lockbtn{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;text-align:left;padding:8px 12px;border:2px solid var(--u, var(--accent));border-radius:12px;background:color-mix(in srgb, var(--u, var(--accent)) 10%, var(--panel));color:var(--ink);font-size:15px}
.lockbtn.mod{grid-template-columns:minmax(0,1fr) auto;font-size:16px}
.lockbtn .lt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lockbtn.off{border-color:var(--line);border-style:dashed;background:transparent;color:var(--muted)}
.lockbtn:disabled{opacity:.6;cursor:not-allowed}
</style>
</head><body>
<div class="wrap">
  <header class="topbar">
    <a class="brand" href="./">
      <img class="logo" src="../logo.png" alt="" width="36" height="36">
      App Builder · Teachers
    </a>
    <span class="spacer"></span>
    <nav class="nav" aria-label="Main">
      <a href="./">Course</a>
      <a href="./#teachers">Teaching guide</a>
      <a href="../academy/teacher.html">Teacher Dashboard</a>
    </nav>
  </header>
  <main id="app"></main>
  <div class="foot"><span>Uses the same classes as CyberTeaches Academy.</span><span>Only you can see your students' work.</span></div>
</div>
<script src="../academy/firebase-config.js"></script>
<script src="../academy/cloud.js?v=22"></script>
<script src="content.js"></script>
<script>
// App Builder class progress for teachers. Reads the same classes and roster as the Academy Teacher Dashboard
// (academy/cloud.js). Each student's App Builder work is in classes/{code}/students/{uid}.appBuilder:
// { done: {lessonId: time}, steps: {lessonId: count}, work: {fieldKey: text}, updatedAt }. This page only reads.
(function(){
  const app = document.getElementById('app'), Cloud = window.Cloud;
  const UNITS = window.AP_UNITS;
  const OPENU = UNITS.filter(u => u.topics.some(t => !t.soon)); // modules with at least one open lesson
  const LIVE = UNITS.flatMap(u => u.topics.filter(t => !t.soon).map(t => Object.assign({ unit: u }, t)));
  const FIELDS = LIVE.flatMap(t => (t.fields || []).map(f => Object.assign({ topic: t }, f)));
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
  const uname = u => u.track ? 'App Challenge track' : `Module ${u.num}: ${u.title}`;
  const ushort = u => u.track ? 'Challenge' : `M${u.num}`;
  const ab = s => s.appBuilder || {};
  const doneIn = (s, u) => u.topics.filter(t => !t.soon && (ab(s).done || {})[t.id]).length;
  const total = s => LIVE.filter(t => (ab(s).done || {})[t.id]).length;
  const written = s => FIELDS.filter(f => (ab(s).work || {})[f.key]).length;
  const ago = ts => { const ms = ts && ts.toMillis ? ts.toMillis() : ts && ts.seconds ? ts.seconds * 1000 : 0; if (!ms) return 'Not started'; const m = Math.round((Date.now() - ms) / 60000); return m < 2 ? 'Just now' : m < 60 ? m + ' min ago' : m < 1440 ? Math.round(m / 60) + ' hr ago' : (Math.round(m / 1440) === 1 ? '1 day ago' : Math.round(m / 1440) + ' days ago'); };
  const G = (s, t) => window.AB_GRADE(t, { done: (ab(s).done || {})[t.id], first: (ab(s).quiz || {})[t.id], steps: (ab(s).steps || {})[t.id], fields: ab(s).work || {} });
  // Average score over the lessons a student has started. null when they have started none.
  const avgOf = (s, list) => { const g = list.map(t => G(s, t)).filter(x => x.started); return g.length ? Math.round(g.reduce((a, x) => a + x.pct, 0) / g.length) : null; };
  const pc = v => v == null ? '<span class="cellp">–</span>' : `<span class="cellp ${v >= 90 ? 'full' : 'part'}">${v}%</span>`;
  const parts = g => `Quick check ${g.tried ? g.first + '/' + g.questions + ' first try' : 'not taken'} · Steps ${g.steps}/${g.stepsOf}${g.writtenOf ? ` · Boxes ${g.written}/${g.writtenOf}` : ''}`;
  const pick = { get(){ try { return localStorage.getItem('cyberteaches:teacherClass'); } catch (e) { return null; } }, set(v){ try { localStorage.setItem('cyberteaches:teacherClass', v); } catch (e) {} } };
  let lockSeen = '[]';
  let mode = 'grades', gmod = OPENU[0], lesson = null;
  let classes = [], current = null, roster = [], open = null, stopClasses = null, stopRoster = null, stopStatus = null, gateUid;

  const hero = (t, p, extra) => { app.innerHTML = `<div class="page-head"><span class="label">For teachers</span><h1>${t}</h1><p>${p}</p>${extra || ''}</div>`; };
  const stopAll = () => { [stopClasses, stopRoster, stopStatus].forEach(f => f && f()); stopClasses = stopRoster = stopStatus = null; };

  if (!Cloud || !Cloud.enabled) { hero('Class progress is not switched on', 'Sign-in is not set up on this copy of the site, so there are no classes to show. Students can still do every lesson, and their work is saved in their own browser.'); return; }
  Cloud.onChange(() => {
    if (!Cloud.ready) return hero('Checking your account…', 'One moment.');
    const u = Cloud.user, id = u ? u.uid : null;
    if (id === gateUid && id) return;
    gateUid = id; stopAll();
    const signIn = '<p style="margin-top:16px"><a class="btn primary" href="../academy/teacher.html">Go to the Teacher Dashboard</a></p>';
    if (!u) return hero('See how your class is doing in App Builder', 'Sign in on the Teacher Dashboard, then come back to this page. App Builder uses the same teacher account and the same classes as CyberTeaches Academy.', signIn);
    if (Cloud.isStudentLogin(u)) return hero('This is a student login', 'This page is for teachers. Open the course to keep building your app.', '<p style="margin-top:16px"><a class="btn primary" href="./">Open the course</a></p>');
    if (Cloud.isAdmin(u)) return start();
    stopStatus = Cloud.watchTeacherStatus((st, err) => {
      if (err) return hero('Could not check your access', 'Check your internet connection and reload the page.');
      if (st && st.status === 'approved') { if (!stopClasses) start(); }
      else hero('Teacher access needed', 'This account is not an approved teacher account yet. Ask for teacher access on the Teacher Dashboard.', signIn);
    });
  });

  function start(){
    app.innerHTML = `<nav class="courseswitch" aria-label="Course to manage"><span class="label">Course</span><a class="btn small" href="../academy/teacher.html">Coding Academy</a><span class="btn small primary" aria-current="page">App Builder</span><span class="muted">Your classes work in both courses. Pick the course you want to manage.</span></nav>
      <div class="page-head"><span class="label">For teachers</span><h1>App Builder class progress</h1>
      <p>See each student's automatic lesson scores, which lessons they finished, and what they wrote. To create a class or make student logins, use the <a href="../academy/teacher.html">Teacher Dashboard</a>.</p></div>
      <div class="row" id="tabs" role="tablist" aria-label="Your classes"></div><div id="classview"></div>`;
    stopClasses = Cloud.watchClasses((list, err) => {
      classes = list.filter(c => !c.archived).sort((a, b) => (a.name || a.code).localeCompare(b.name || b.code));
      const tabs = document.getElementById('tabs'), view = document.getElementById('classview');
      if (err) { view.innerHTML = '<div class="card">Could not load your classes. Check your internet connection and reload.</div>'; return; }
      if (!classes.length) { tabs.innerHTML = ''; view.innerHTML = '<div class="card"><h2 style="font-size:20px;margin-bottom:8px">No classes yet</h2><p style="margin:0 0 14px">Create a class on the Teacher Dashboard. Then share the App Builder join link with your students.</p><a class="btn primary" href="../academy/teacher.html">Create a class</a></div>'; return; }
      // Open on the class last chosen here or on the Teacher Dashboard, so switching course keeps the same class.
      if (!current || !classes.find(c => c.code === current)) select((classes.find(c => c.code === pick.get()) || classes[0]).code); else { tabsHtml(); const now = JSON.stringify((classes.find(c => c.code === current) || {}).abLocked || []); if (now !== lockSeen) render(); }
    });
  }
  function tabsHtml(){
    document.getElementById('tabs').innerHTML = classes.map(c => `<button class="btn${c.code === current ? ' primary' : ''}" role="tab" aria-selected="${c.code === current}" data-code="${esc(c.code)}">${esc(c.name || c.code)}</button>`).join('');
    document.querySelectorAll('#tabs [data-code]').forEach(b => b.addEventListener('click', () => select(b.dataset.code)));
  }
  function select(code){
    current = code; pick.set(code); open = null; lesson = null; roster = []; if (stopRoster) stopRoster();
    tabsHtml(); render();
    stopRoster = Cloud.watchRoster(code, (list, err) => { roster = list.sort((a, b) => (a.name || '').localeCompare(b.name || '')); render(err); });
  }

  function render(err){
    const c = classes.find(x => x.code === current); if (!c) return;
    const view = document.getElementById('classview'), n = roster.length;
    const lk = new Set(c.abLocked || []); lockSeen = JSON.stringify(c.abLocked || []);
    const saveLocks = async list => { try { await Cloud.db.collection('classes').doc(c.code).update({ abLocked: list }); } catch (e) { console.error(e); const m = document.getElementById('lockErr'); if (m) { m.textContent = 'Could not save. Check your connection and try again.'; m.hidden = false; } } };
    const link = location.origin + location.pathname.replace(/teacher\.html$/, '') + '?class=' + c.code;
    const started = roster.filter(s => total(s) || written(s)).length, avg = n ? roster.reduce((t, s) => t + total(s), 0) / n : 0;
    view.innerHTML = `
      <div class="two" style="margin-top:16px">
        <section class="card"><span class="label">How students join</span>
          <p style="margin:8px 0 6px">Share this link. Students sign in, and the class code is filled in for them.</p>
          <div class="url" id="joinLink">${esc(link)}</div>
          <div class="row" style="margin-top:10px"><button class="btn small" type="button" id="copyLink">Copy link</button><span class="muted">Class code: <b class="mono">${esc(c.code)}</b></span></div>
          <p class="muted" style="margin:10px 0 0;font-size:15px">Students who already joined this class in the Academy are in it here too. They only need to sign in.</p></section>
        <section class="card"><span class="label">${esc(c.name || c.code)}</span>
          <div class="stats"><div><b>${n}</b><span class="muted">students in class</span></div><div><b>${started}</b><span class="muted">started App Builder</span></div><div><b>${avg.toFixed(1)}</b><span class="muted">lessons done, average, of ${LIVE.length}</span></div></div></section>
      </div>
      <div class="section-head"><div><span class="label">Class</span><h2>Lessons open to students</h2></div><div class="row"><button class="btn" type="button" data-lockall="0">Unlock all</button><button class="btn" type="button" data-lockall="1">Lock all</button></div></div>
      <p class="muted" style="margin:0 0 10px">Select a lesson to lock or unlock it for this class, or lock a whole module. Students see a lock and cannot open it. Changes reach students right away, and their work and scores are kept.</p>
      <div class="locks">${OPENU.map(u => { const all = lk.has(u.id); return `<div class="lockmod" style="--u:var(--u${u.num})"><button class="lockbtn mod${all ? ' off' : ''}" type="button" data-lock="${esc(u.id)}" aria-pressed="${!all}"><b>${esc(uname(u))}</b><span>${all ? '🔒 Module locked' : 'Open'}</span></button>
        <div class="locklessons">${u.topics.filter(t => !t.soon).map(t => { const off = all || lk.has(t.id); return `<button class="lockbtn${off ? ' off' : ''}" type="button" data-lock="${esc(t.id)}" aria-pressed="${!off}" ${all ? 'disabled' : ''}><b>${esc(t.id)}</b><span class="lt">${esc(t.title)}</span><span>${off ? '🔒 Locked' : 'Open'}</span></button>`; }).join('')}</div></div>`; }).join('')}</div>
      <p class="result no" id="lockErr" role="alert" hidden></p>
      <div class="section-head"><div><span class="label">Class</span><h2>${mode === 'grades' ? 'Gradebook' : 'Progress'}</h2></div>
        <div class="row"><button class="btn${mode === 'grades' ? ' primary' : ''}" type="button" data-view="grades" aria-pressed="${mode === 'grades'}">Grades</button><button class="btn${mode === 'progress' ? ' primary' : ''}" type="button" data-view="progress" aria-pressed="${mode === 'progress'}">Progress</button><button class="btn" type="button" id="csv" ${n ? '' : 'disabled'}>Download CSV</button></div></div>
      ${mode === 'grades' ? `<p class="muted" style="margin:0 0 10px">Scores are worked out automatically. Each lesson is worth 10 points: quick check 4 (first try), steps checked off 2, written work that is long enough 4. Select a lesson number to read what everyone wrote for it. Select a student to see all their work.</p>
      <div class="row" role="tablist" aria-label="Module" style="margin-bottom:10px;${OPENU.length < 2 ? 'display:none' : ''}">${OPENU.map(u => `<button class="btn small${u === gmod ? ' primary' : ''}" type="button" role="tab" aria-selected="${u === gmod}" data-mod="${esc(u.id)}" title="${esc(uname(u))}">${esc(u.track ? 'Challenge' : 'Module ' + u.num)}</button>`).join('')}</div>`
      : '<p class="muted" style="margin:0 0 10px">Lessons finished in each module. A lesson is finished when the student gets every quick check question right. Select a student to see each lesson and read their work.</p>'}
      <div class="card" style="padding:0"><div class="scroll">${err ? '<p style="padding:18px;margin:0">Could not load students. Check that the Firestore rules are published.</p>' : n ? (mode === 'grades' ? grades() : table()) : '<p style="padding:18px;margin:0">No students have joined this class yet.</p>'}</div></div>
      <div id="lessonwork"></div>
      <div id="detail"></div>`;
    document.querySelectorAll('[data-view]').forEach(b => b.addEventListener('click', () => { mode = b.dataset.view; lesson = null; render(); }));
    document.querySelectorAll('[data-mod]').forEach(b => b.addEventListener('click', () => { gmod = UNITS.find(u => String(u.id) === b.dataset.mod); lesson = null; render(); }));
    document.querySelectorAll('[data-lesson]').forEach(b => b.addEventListener('click', () => { lesson = lesson === b.dataset.lesson ? null : b.dataset.lesson; open = null; render(); const d = document.getElementById('lessonwork'); if (lesson) d.scrollIntoView({ block: 'start', behavior: 'smooth' }); }));
    lessonWork();
    document.getElementById('copyLink').addEventListener('click', e => {
      const b = e.currentTarget, done = () => { b.textContent = 'Copied'; setTimeout(() => { b.textContent = 'Copy link'; }, 1600); };
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(link).then(done, () => {}); });
    document.getElementById('csv').addEventListener('click', () => csv(c));
    view.querySelectorAll('[data-lock]').forEach(b => b.addEventListener('click', () => { const id = b.dataset.lock, list = [...lk]; saveLocks(lk.has(id) ? list.filter(x => x !== id) : list.concat(id)); }));
    view.querySelectorAll('[data-lockall]').forEach(b => b.addEventListener('click', () => saveLocks(b.dataset.lockall === '1' ? OPENU.map(u => u.id) : [])));
    view.querySelectorAll('[data-uid]').forEach(r => r.addEventListener('click', () => { open = open === r.dataset.uid ? null : r.dataset.uid; render(); const d = document.getElementById('detail'); if (open && d.firstElementChild) d.scrollIntoView({ block: 'start', behavior: 'smooth' }); }));
    detail();
  }
  function table(){
    return `<table class="progress"><thead><tr><th>Student</th>${OPENU.map(u => `<th title="${esc(uname(u))}">${esc(ushort(u))}</th>`).join('')}<th>Lessons</th><th>Written</th><th>Last active</th></tr></thead><tbody>
      ${roster.map(s => `<tr class="${s.uid === open ? 'on' : ''}"><td><button class="who" type="button" data-uid="${esc(s.uid)}" aria-expanded="${s.uid === open}">${esc(s.name || 'Student')}</button></td>
        ${OPENU.map(u => { const live = u.topics.filter(t => !t.soon).length, d = doneIn(s, u); return `<td><span class="cellp ${d === live ? 'full' : d ? 'part' : ''}" style="--u:var(--u${u.num})">${d}/${live}</span></td>`; }).join('')}
        <td><b>${total(s)}</b>/${LIVE.length}</td><td>${written(s)}/${FIELDS.length}</td><td class="muted">${esc(ago(ab(s).updatedAt))}</td></tr>`).join('')}
    </tbody></table>`;
  }
  function grades(){
    const list = gmod.topics.filter(t => !t.soon);
    return `<table class="progress"><thead><tr><th>Student</th>${list.map(t => `<th><button class="who" type="button" data-lesson="${esc(t.id)}" aria-expanded="${t.id === lesson}" title="${esc(t.title)}">${esc(t.id)}</button></th>`).join('')}<th>${esc(gmod.track ? 'Track' : 'Module')} average</th><th>Course average</th></tr></thead><tbody>
      ${roster.map(s => `<tr class="${s.uid === open ? 'on' : ''}"><td><button class="who" type="button" data-uid="${esc(s.uid)}" aria-expanded="${s.uid === open}">${esc(s.name || 'Student')}</button></td>
        ${list.map(t => { const g = G(s, t); return `<td style="--u:var(--u${gmod.num})" title="${esc(parts(g))}">${pc(g.started ? g.pct : null)}</td>`; }).join('')}
        <td style="--u:var(--u${gmod.num})">${pc(avgOf(s, list))}</td><td style="--u:var(--accent)">${pc(avgOf(s, LIVE))}</td></tr>`).join('')}
    </tbody></table>`;
  }
  // Everyone's work for one lesson on one page, for quick grading.
  function lessonWork(){
    const box = document.getElementById('lessonwork'), t = LIVE.find(x => x.id === lesson);
    if (!t || mode !== 'grades') { box.innerHTML = ''; return; }
    box.innerHTML = `<div class="section-head"><div><span class="label">Lesson ${esc(t.id)} · everyone's work</span><h2>${esc(t.title)}</h2></div><button class="btn" type="button" id="closeLesson">Close</button></div>
      ${roster.map(s => { const g = G(s, t), w = ab(s).work || {}; return `<section class="card lw" style="--u:var(--u${t.unit.num})"><div class="lw-head"><h3>${esc(s.name || 'Student')}</h3>${pc(g.started ? g.pct : null)}<span class="muted">${g.started ? esc(parts(g)) : 'Not started'}</span></div>
        ${(t.fields || []).map(f => `<div class="plan-row"><span class="label">${esc(f.label)}</span><div class="v${w[f.key] ? '' : ' empty'}">${w[f.key] ? esc(w[f.key]) : 'Not written yet.'}</div></div>`).join('')}</section>`; }).join('')}`;
    document.getElementById('closeLesson').addEventListener('click', () => { lesson = null; render(); });
  }
  function detail(){
    const box = document.getElementById('detail'), s = roster.find(x => x.uid === open);
    if (!s) { box.innerHTML = ''; return; }
    const a = ab(s), w = a.work || {};
    box.innerHTML = `<div class="section-head"><div><span class="label">Student</span><h2>${esc(s.name || 'Student')}</h2></div><button class="btn" type="button" id="closeDetail">Close</button></div>
      <div class="lesson" style="grid-template-columns:minmax(0,1fr) minmax(0,1.4fr)">
        <section class="card"><h3 style="font-size:19px;margin-bottom:10px">Lessons</h3>
          ${OPENU.map(u => `<div class="dmod" style="--u:var(--u${u.num})"><b>${esc(uname(u))}</b><ul>${u.topics.filter(t => !t.soon).map(t => { const d = (a.done || {})[t.id], st = (a.steps || {})[t.id] || 0, g = G(s, t); return `<li class="${d ? 'done' : ''}"><span class="chk" aria-hidden="true">${d ? '✓' : ''}</span><span>${t.id} ${esc(t.title)}${d ? '<span class="sr"> (finished)</span>' : ''}</span><span class="muted" title="${esc(parts(g))}">${g.started ? g.pct + '%' : '–'}</span></li>`; }).join('')}</ul></div>`).join('')}</section>
        <section class="card"><h3 style="font-size:19px;margin-bottom:10px">Written work</h3>
          ${FIELDS.some(f => w[f.key]) ? FIELDS.map((f, k) => { const head = !k || FIELDS[k - 1].topic.unit !== f.topic.unit ? `<h4 class="plan-head">${esc(uname(f.topic.unit))}</h4>` : ''; return `${head}<div class="plan-row"><span class="label">${esc(f.label)} · lesson ${f.topic.id}</span><div class="v${w[f.key] ? '' : ' empty'}">${w[f.key] ? esc(w[f.key]) : 'Not written yet.'}</div></div>`; }).join('') : '<p class="muted" style="margin:0">Nothing written yet.</p>'}</section>
      </div>`;
    document.getElementById('closeDetail').addEventListener('click', () => { open = null; render(); });
  }
  function csv(c){
    const q = v => '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"';
